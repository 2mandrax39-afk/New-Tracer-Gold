
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>New Tracer Gold</title>

<style>
* { box-sizing: border-box; }

:root {
  --gold: #d4af37;
  --gold2: #927019;
  --black: #050505;
  --panel: #111111;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--black);
  color: var(--gold);
  font-family: Arial, sans-serif;
  overflow: hidden;
}

body {
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

button {
  background: #101010;
  color: var(--gold);
  border: 1px solid var(--gold2);
  border-radius: 7px;
  padding: 7px;
  min-height: 34px;
  font-size: 12px;
  font-weight: bold;
}

button.active {
  background: var(--gold);
  color: #000;
}

button:active { opacity: .7; }

input[type=file] { display:none; }

input[type=range] {
  width: 100%;
  accent-color: var(--gold);
}

/* TOP */
#top {
  flex: 0 0 auto;
  background: #050505;
  padding: 5px;
  border-bottom: 1px solid #33260b;
}

#title {
  text-align: center;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 3px;
  padding: 5px;
}

.toolbar {
  display: flex;
  gap: 4px;
}

.toolbar button {
  flex: 1;
}

/* CENTER A4 CAMERA */
#stage {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  overflow: hidden;
}

#frame {
  height: 100%;
  max-height: 100%;
  aspect-ratio: 1 / 1.41421356;
  max-width: 100%;
  position: relative;
  overflow: hidden;
  background: #000;
  border-left: 1px solid #48350e;
  border-right: 1px solid #48350e;
}

#camera, #overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#overlay {
  touch-action: none;
}

/* BOTTOM MENU */
#bottom {
  flex: 0 0 29dvh;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 5px;
  background: #050505;
  border-top: 1px solid #33260b;
}

.panel {
  background: var(--panel);
  border: 1px solid #30240d;
  border-radius: 8px;
  padding: 7px;
  margin-bottom: 5px;
}

.heading {
  font-size: 10px;
  letter-spacing: 1.5px;
  color: #907329;
  margin-bottom: 6px;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.row button {
  flex: 1 1 auto;
}

.slider {
  margin: 5px 0;
}

.sliderhead {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 3px;
}

#status {
  text-align: center;
  font-size: 10px;
  padding: 3px;
  color: #8c722a;
}

@media (max-height: 700px) {
  #bottom { flex-basis: 26dvh; }
  button { min-height: 29px; padding: 5px; font-size: 11px; }
}
</style>
</head>

<body>

<div id="top">
  <div id="title">NEW TRACER GOLD</div>

  <div class="toolbar">
    <button id="cameraBtn">📷 Kamera</button>
    <button id="switchBtn">↔ Skift</button>
    <button id="fileBtn">▣ Reference</button>
    <button id="fitBtn">Fit</button>
    <button id="lockBtn">🔓 Lås</button>
  </div>

  <input id="file" type="file" accept="image/*">
</div>

<div id="stage">
  <div id="frame">
    <canvas id="camera"></canvas>
    <canvas id="overlay"></canvas>
  </div>
</div>

<div id="bottom">

  <div class="panel">
    <div class="heading">IMAGE TOOLS</div>
    <div class="row">
      <button id="bw">Sort/Hvid</button>
      <button id="gray">Gråtoner</button>
      <button id="pencil">Blyant</button>
      <button id="contours">Konturer</button>
      <button id="edges">Kanter</button>
    </div>
  </div>

  <div class="panel">
    <div class="heading">REFERENCE & KAMERA</div>

    <div class="slider">
      <div class="sliderhead">
        <span>Reference zoom</span>
        <span id="zoomVal">100%</span>
      </div>
      <input id="zoom" type="range" min="10" max="500" value="100">
    </div>

    <div class="slider">
      <div class="sliderhead">
        <span>Transparens</span>
        <span id="opacityVal">50%</span>
      </div>
      <input id="opacity" type="range" min="0" max="100" value="50">
    </div>

    <div class="slider">
      <div class="sliderhead">
        <span>Kamera zoom</span>
        <span id="camZoomVal">1.0x</span>
      </div>
      <input id="camZoom" type="range" min="1" max="5" step="0.1" value="1">
    </div>

    <div class="slider">
      <div class="sliderhead">
        <span>Kontrast</span>
        <span id="contrastVal">100%</span>
      </div>
      <input id="contrast" type="range" min="50" max="250" value="100">
    </div>
  </div>

  <div class="panel">
    <div class="heading">POSITION</div>
    <div class="row">
      <button id="centerBtn">⊙ Center</button>
      <button id="resetBtn">↺ Nulstil</button>
    </div>
  </div>

  <div id="status">Klar</div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const cameraCanvas = $("camera");
const overlayCanvas = $("overlay");

const cameraCtx = cameraCanvas.getContext("2d");
const overlayCtx = overlayCanvas.getContext("2d");

const video = document.createElement("video");
video.playsInline = true;
video.muted = true;
video.autoplay = true;

let stream = null;
let facing = "environment";
let cameraOn = false;

let reference = null;
let referenceLoaded = false;
let locked = false;

let refX = 0;
let refY = 0;
let refScale = 1;
let fitScale = 1;
let opacity = 0.5;

let mode = "normal";
let cameraZoom = 1;
let contrast = 100;

let pointers = new Map();
let pinchDistance = 0;
let pinchBaseScale = 1;
let pinchBaseX = 0;
let pinchBaseY = 0;
let pinchCenter = null;

function status(message) {
  $("status").textContent = message;
}

/* RESIZE */

function resize() {
  const rect = $("frame").getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  cameraCanvas.width = Math.max(1, Math.round(rect.width * dpr));
  cameraCanvas.height = Math.max(1, Math.round(rect.height * dpr));

  overlayCanvas.width = cameraCanvas.width;
  overlayCanvas.height = cameraCanvas.height;

  cameraCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (referenceLoaded) {
    fitReference();
  } else {
    drawReference();
  }
}

window.addEventListener("resize", resize);

/* CAMERA */

async function startCamera() {
  try {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    status("Starter kamera...");

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facing },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    cameraOn = true;
    status("Kamera aktiv");
  } catch (error) {
    status("Kamera kunne ikke startes");
  }
}

$("cameraBtn").onclick = startCamera;

$("switchBtn").onclick = () => {
  facing = facing === "environment" ? "user" : "environment";
  startCamera();
};

/* REFERENCE IMAGE */

$("fileBtn").onclick = () => $("file").click();

$("file").onchange = event => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  const img = new Image();

  img.onload = () => {
    reference = img;
    referenceLoaded = true;
    fitReference();
    status("Reference indlæst");
  };

  img.onerror = () => {
    status("Kunne ikke indlæse billedet");
  };

  img.src = URL.createObjectURL(file);
};

$("fitBtn").onclick = fitReference;

function fitReference() {
  if (!referenceLoaded || !reference) return;

  const w = overlayCanvas.clientWidth;
  const h = overlayCanvas.clientHeight;

  fitScale = Math.min(
    w / reference.width,
    h / reference.height
  );

  refScale = fitScale;

  refX = (w - reference.width * refScale) / 2;
  refY = (h - reference.height * refScale) / 2;

  $("zoom").value = 100;
  $("zoomVal").textContent = "100%";

  drawReference();
}

function drawReference() {
  const w = overlayCanvas.clientWidth;
  const h = overlayCanvas.clientHeight;

  overlayCtx.clearRect(0, 0, w, h);

  if (!referenceLoaded || !reference) return;

  overlayCtx.save();
  overlayCtx.globalAlpha = opacity;

  overlayCtx.drawImage(
    reference,
    refX,
    refY,
    reference.width * refScale,
    reference.height * refScale
  );

  overlayCtx.restore();
}

/* REFERENCE ZOOM */

$("zoom").oninput = event => {
  if (!referenceLoaded) return;

  const newScale = fitScale * Number(event.target.value) / 100;

  const cx = overlayCanvas.clientWidth / 2;
  const cy = overlayCanvas.clientHeight / 2;

  const ratio = newScale / refScale;

  refX = cx - (cx - refX) * ratio;
  refY = cy - (cy - refY) * ratio;
  refScale = newScale;

  $("zoomVal").textContent = event.target.value + "%";

  drawReference();
};

/* TRANSPARENCY */

$("opacity").oninput = event => {
  opacity = Number(event.target.value) / 100;
  $("opacityVal").textContent = event.target.value + "%";
  drawReference();
};

/* CAMERA ZOOM */

$("camZoom").oninput = event => {
  cameraZoom = Number(event.target.value);
  $("camZoomVal").textContent = cameraZoom.toFixed(1) + "x";
};

/* CONTRAST */

$("contrast").oninput = event => {
  contrast = Number(event.target.value);
  $("contrastVal").textContent = contrast + "%";
};

/* LOCK */

$("lockBtn").onclick = () => {
  locked = !locked;

  $("lockBtn").textContent = locked ? "🔒 Låst" : "🔓 Lås";
  $("lockBtn").classList.toggle("active", locked);
};

/* CENTER */

$("centerBtn").onclick = () => {
  if (!referenceLoaded) return;

  refX = (overlayCanvas.clientWidth - reference.width * refScale) / 2;
  refY = (overlayCanvas.clientHeight - reference.height * refScale) / 2;

  drawReference();
};

/* RESET */

$("resetBtn").onclick = () => {
  mode = "normal";
  cameraZoom = 1;
  contrast = 100;
  locked = false;

  $("camZoom").value = 1;
  $("camZoomVal").textContent = "1.0x";

  $("contrast").value = 100;
  $("contrastVal").textContent = "100%";

  $("lockBtn").textContent = "🔓 Lås";
  $("lockBtn").classList.remove("active");

  ["bw", "gray", "pencil", "contours", "edges"].forEach(id => {
    $(id).classList.remove("active");
  });

  if (referenceLoaded) {
    fitReference();
  }

  drawReference();
};

/* FILTER BUTTONS */

function setMode(newMode) {
  mode = mode === newMode ? "normal" : newMode;

  ["bw", "gray", "pencil", "contours", "edges"].forEach(id => {
    $(id).classList.toggle("active", id === mode);
  });
}

$("bw").onclick = () => setMode("bw");
$("gray").onclick = () => setMode("gray");
$("pencil").onclick = () => setMode("pencil");
$("contours").onclick = () => setMode("contours");
$("edges").onclick = () => setMode("edges");

/* CAMERA FILTER */

function getFilter() {
  switch (mode) {
    case "bw":
      return "grayscale(1) contrast(220%)";
    case "gray":
      return "grayscale(1) contrast(" + contrast + "%)";
    case "pencil":
      return "grayscale(1) contrast(250%) brightness(140%)";
    case "contours":
      return "grayscale(1) contrast(300%)";
    case "edges":
      return "grayscale(1) contrast(400%) invert(1)";
    default:
      return "contrast(" + contrast + "%)";
  }
}

/* DRAW CAMERA */

function drawCamera() {
  const w = cameraCanvas.clientWidth;
  const h = cameraCanvas.clientHeight;

  cameraCtx.clearRect(0, 0, w, h);

  if (cameraOn && video.readyState >= 2 && video.videoWidth > 0) {
    const base = Math.max(
      w / video.videoWidth,
      h / video.videoHeight
    );

    const s = base * cameraZoom;

    const dw = video.videoWidth * s;
    const dh = video.videoHeight * s;

    const dx = (w - dw) / 2;
    const dy = (h - dh) / 2;

    cameraCtx.save();
    cameraCtx.filter = getFilter();
    cameraCtx.drawImage(video, dx, dy, dw, dh);
    cameraCtx.restore();

    if (mode === "bw") {
      applyThreshold();
    }
  }

  requestAnimationFrame(drawCamera);
}

/* TRUE BLACK AND WHITE */

function applyThreshold() {
  try {
    const w = cameraCanvas.width;
    const h = cameraCanvas.height;

    const imageData = cameraCtx.getImageData(0, 0, w, h);
    const pixels = imageData.data;

    for (let i = 0; i < pixels.length; i += 4) {
      const average = (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
      const value = average > 128 ? 255 : 0;

      pixels[i] = value;
      pixels[i + 1] = value;
      pixels[i + 2] = value;
    }

    cameraCtx.putImageData(imageData, 0, 0);
  } catch (error) {
    /* Filter fallback */
  }
}

/* REFERENCE TOUCH CONTROL */

overlayCanvas.addEventListener("pointerdown", event => {
  if (locked || !referenceLoaded) return;

  overlayCanvas.setPointerCapture(event.pointerId);

  pointers.set(event.pointerId, {
    x: event.clientX,
    y: event.clientY
  });

  if (pointers.size === 2) {
    const pts = Array.from(pointers.values());

    pinchDistance = Math.max(
      1,
      Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y)
    );

    pinchBaseScale = refScale;
    pinchBaseX = refX;
    pinchBaseY = refY;

    pinchCenter = {
      x: (pts[0].x + pts[1].x) / 2,
      y: (pts[0].y + pts[1].y) / 2
    };
  }
});

overlayCanvas.addEventListener("pointermove", event => {
  if (locked || !pointers.has(event.pointerId)) return;

  const previous = pointers.get(event.pointerId);

  pointers.set(event.pointerId, {
    x: event.clientX,
    y: event.clientY
  });

  if (pointers.size === 1) {
    refX += event.clientX - previous.x;
    refY += event.clientY - previous.y;
    drawReference();
  }

  if (pointers.size === 2 && pinchDistance > 0) {
    const pts = Array.from(pointers.values());

    const distance = Math.hypot(
      pts[0].x - pts[1].x,
      pts[0].y - pts[1].y
    );

    const mid = {
      x: (pts[0].x + pts[1].x) / 2,
      y: (pts[0].y + pts[1].y) / 2
    };

    refScale = Math.max(
      fitScale * 0.1,
      Math.min(fitScale * 5, pinchBaseScale * distance / pinchDistance)
    );

    refX = pinchBaseX + mid.x - pinchCenter.x;
    refY = pinchBaseY + mid.y - pinchCenter.y;

    const zoomPercent = Math.round(refScale / fitScale * 100);

    $("zoom").value = zoomPercent;
    $("zoomVal").textContent = zoomPercent + "%";

    drawReference();
  }
});

function pointerEnd(event) {
  pointers.delete(event.pointerId);

  if (pointers.size < 2) {
    pinchDistance = 0;
  }
}

overlayCanvas.addEventListener("pointerup", pointerEnd);
overlayCanvas.addEventListener("pointercancel", pointerEnd);

/* START */

resize();
requestAnimationFrame(drawCamera);
</script>

</body>
</html>
