
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>New Tracer Gold</title>
<style>
*{box-sizing:border-box}
:root{--gold:#d4af37;--gold2:#92701a}
html,body{margin:0;width:100%;height:100%;background:#050505;color:var(--gold);font-family:Arial,sans-serif;overflow:hidden}
body{height:100dvh;display:flex;flex-direction:column}
button{background:#111;color:var(--gold);border:1px solid var(--gold2);border-radius:7px;padding:6px;min-height:32px;font-size:11px;font-weight:bold}
button.active{background:var(--gold);color:#000}
input[type=file]{display:none}
input[type=range]{width:100%;accent-color:var(--gold)}
#top{flex:0 0 auto;padding:4px;background:#050505;border-bottom:1px solid #33260b}
#title{text-align:center;font-size:14px;font-weight:bold;letter-spacing:3px;padding:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:4px}
.toolbar button{flex:1 1 auto}

/* A4 PORTRAIT: FORCE HIGH AND NARROW */
#stage{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
#frame{
  flex:none;
  height:100%;
  width:auto;
  aspect-ratio:210/297;
  max-height:100%;
  max-width:100%;
  position:relative;
  overflow:hidden;
  background:#000;
  border:1px solid #44330d;
}
#camera,#overlay{position:absolute;inset:0;width:100%;height:100%;display:block}
#overlay{touch-action:none}

/* BOTTOM MENU */
#bottom{flex:0 0 30dvh;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:5px;background:#050505;border-top:1px solid #33260b}
.panel{background:#111;border:1px solid #30240d;border-radius:8px;padding:7px;margin-bottom:5px}
.heading{font-size:10px;letter-spacing:1.5px;color:#907329;margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:4px}
.row button{flex:1 1 auto}
.slider{margin:5px 0}
.sliderhead{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
#status{text-align:center;font-size:10px;padding:3px;color:#8c722a}
@media(max-height:700px){#bottom{flex-basis:27dvh}button{min-height:28px;padding:4px}}
</style>
</head>
<body>

<div id="top">
<div id="title">NEW TRACER GOLD</div>
<div class="toolbar">
<button id="cameraBtn">📷 Kamera</button>
<button id="switchBtn">↔ Skift</button>
<button id="fileBtn">▣ Reference</button>
<button id="fitBtn">Fit</button>
<button id="lockBtn">🔓 Lås</button>
</div>
<input id="file" type="file" accept="image/*">
</div>

<div id="stage">
<div id="frame">
<canvas id="camera"></canvas>
<canvas id="overlay"></canvas>
</div>
</div>

<div id="bottom">
<div class="panel">
<div class="heading">IMAGE TOOLS</div>
<div class="row">
<button id="bw">Sort/Hvid</button>
<button id="gray">Gråtoner</button>
<button id="pencil">Blyant</button>
<button id="contours">Konturer</button>
<button id="edges">Kanter</button>
</div>
</div>

<div class="panel">
<div class="heading">REFERENCE & KAMERA</div>

<div class="slider">
<div class="sliderhead"><span>Reference zoom</span><span id="zoomVal">100%</span></div>
<input id="zoom" type="range" min="10" max="500" value="100">
</div>

<div class="slider">
<div class="sliderhead"><span>Transparens</span><span id="opacityVal">50%</span></div>
<input id="opacity" type="range" min="0" max="100" value="50">
</div>

<div class="slider">
<div class="sliderhead"><span>Kamera zoom</span><span id="camZoomVal">1.0x</span></div>
<input id="camZoom" type="range" min="1" max="5" step="0.1" value="1">
</div>

<div class="slider">
<div class="sliderhead"><span>Kontrast</span><span id="contrastVal">100%</span></div>
<input id="contrast" type="range" min="50" max="250" value="100">
</div>
</div>

<div class="panel">
<div class="heading">POSITION</div>
<div class="row">
<button id="centerBtn">⊙ Center</button>
<button id="resetBtn">↺ Nulstil</button>
</div>
</div>
<div id="status">Klar</div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const cam=$("camera"),overlay=$("overlay");
const c=cam.getContext("2d",{willReadFrequently:true});
const o=overlay.getContext("2d");

const video=document.createElement("video");
video.playsInline=true;
video.muted=true;
video.autoplay=true;

let stream=null,facing="environment",cameraOn=false;
let img=null,loaded=false,locked=false;
let x=0,y=0,scale=1,fitScale=1,opacity=.5;
let mode="normal",cameraZoom=1,contrast=100;
let pointers=new Map(),pinchDist=0,pinchScale=1,pinchX=0,pinchY=0,pinchMid=null;

function say(t){$("status").textContent=t}

function resize(){
 const r=$("frame").getBoundingClientRect();
 const d=Math.min(window.devicePixelRatio||1,2);
 cam.width=Math.max(1,Math.round(r.width*d));
 cam.height=Math.max(1,Math.round(r.height*d));
 overlay.width=cam.width;
 overlay.height=cam.height;
 c.setTransform(d,0,0,d,0,0);
 o.setTransform(d,0,0,d,0,0);
 if(loaded)fitImage();
 else drawReference();
}
window.addEventListener("resize",resize);

/* CAMERA */
async function startCamera(){
 try{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  say("Starter kamera...");
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},
   audio:false
  });
  video.srcObject=stream;
  await video.play();
  cameraOn=true;
  say("Kamera aktiv");
 }catch(e){say("Kamera kunne ikke startes")}
}
$("cameraBtn").onclick=startCamera;
$("switchBtn").onclick=()=>{
 facing=facing==="environment"?"user":"environment";
 startCamera();
};

/* REFERENCE */
$("fileBtn").onclick=()=>$("file").click();
$("file").onchange=e=>{
 const f=e.target.files&&e.target.files[0];
 if(!f)return;
 const im=new Image();
 im.onload=()=>{
  img=im;
  loaded=true;
  fitImage();
  say("Reference indlæst");
 };
 im.onerror=()=>say("Billedet kunne ikke indlæses");
 im.src=URL.createObjectURL(f);
};
$("fitBtn").onclick=fitImage;

function fitImage(){
 if(!loaded||!img)return;
 const w=overlay.clientWidth,h=overlay.clientHeight;
 fitScale=Math.min(w/img.width,h/img.height);
 scale=fitScale;
 x=(w-img.width*scale)/2;
 y=(h-img.height*scale)/2;
 $("zoom").value=100;
 $("zoomVal").textContent="100%";
 drawReference();
}

function drawReference(){
 const w=overlay.clientWidth,h=overlay.clientHeight;
 o.clearRect(0,0,w,h);
 if(!loaded||!img)return;
 o.save();
 o.globalAlpha=opacity;
 o.drawImage(img,x,y,img.width*scale,img.height*scale);
 o.restore();
}

/* REFERENCE ZOOM */
$("zoom").oninput=e=>{
 if(!loaded)return;
 const ns=fitScale*Number(e.target.value)/100;
 const cx=overlay.clientWidth/2,cy=overlay.clientHeight/2;
 const ratio=ns/scale;
 x=cx-(cx-x)*ratio;
 y=cy-(cy-y)*ratio;
 scale=ns;
 $("zoomVal").textContent=e.target.value+"%";
 drawReference();
};

/* TRANSPARENCY */
$("opacity").oninput=e=>{
 opacity=Number(e.target.value)/100;
 $("opacityVal").textContent=e.target.value+"%";
 drawReference();
};

/* CAMERA ZOOM */
$("camZoom").oninput=e=>{
 cameraZoom=Number(e.target.value);
 $("camZoomVal").textContent=cameraZoom.toFixed(1)+"x";
};

/* CONTRAST */
$("contrast").oninput=e=>{
 contrast=Number(e.target.value);
 $("contrastVal").textContent=contrast+"%";
};

/* LOCK */
$("lockBtn").onclick=()=>{
 locked=!locked;
 $("lockBtn").textContent=locked?"🔒 Låst":"🔓 Lås";
 $("lockBtn").classList.toggle("active",locked);
};

/* CENTER */
$("centerBtn").onclick=()=>{
 if(!loaded)return;
 x=(overlay.clientWidth-img.width*scale)/2;
 y=(overlay.clientHeight-img.height*scale)/2;
 drawReference();
};

/* RESET */
$("resetBtn").onclick=()=>{
 mode="normal";
 cameraZoom=1;
 contrast=100;
 locked=false;
 $("camZoom").value=1;
 $("camZoomVal").textContent="1.0x";
 $("contrast").value=100;
 $("contrastVal").textContent="100%";
 $("lockBtn").textContent="🔓 Lås";
 $("lockBtn").classList.remove("active");
 ["bw","gray","pencil","contours","edges"].forEach(id=>$(id).classList.remove("active"));
 if(loaded)fitImage();
 drawReference();
};

/* FILTERS */
function setMode(m){
 mode=mode===m?"normal":m;
 ["bw","gray","pencil","contours","edges"].forEach(id=>{
  $(id).classList.toggle("active",id===mode);
 });
}
$("bw").onclick=()=>setMode("bw");
$("gray").onclick=()=>setMode("gray");
$("pencil").onclick=()=>setMode("pencil");
$("contours").onclick=()=>setMode("contours");
$("edges").onclick=()=>setMode("edges");

function getFilter(){
 if(mode==="bw")return "grayscale(1) contrast(220%)";
 if(mode==="gray")return "grayscale(1) contrast("+contrast+"%)";
 if(mode==="pencil")return "grayscale(1) contrast(250%) brightness(140%)";
 if(mode==="contours")return "grayscale(1) contrast(300%)";
 if(mode==="edges")return "grayscale(1) contrast(400%) invert(1)";
 return "contrast("+contrast+"%)";
}

/* CAMERA RENDER */
function drawCamera(){
 const w=cam.clientWidth,h=cam.clientHeight;
 c.clearRect(0,0,w,h);
 if(cameraOn&&video.readyState>=2&&video.videoWidth){
  const base=Math.max(w/video.videoWidth,h/video.videoHeight);
  const s=base*cameraZoom;
  const dw=video.videoWidth*s,dh=video.videoHeight*s;
  const dx=(w-dw)/2,dy=(h-dh)/2;
  c.save();
  c.filter=getFilter();
  c.drawImage(video,dx,dy,dw,dh);
  c.restore();
  if(mode==="bw")threshold();
 }
 requestAnimationFrame(drawCamera);
}

/* BLACK & WHITE */
function threshold(){
 try{
  const w=cam.width,h=cam.height;
  const data=c.getImageData(0,0,w,h);
  const p=data.data;
  for(let i=0;i<p.length;i+=4){
   const v=(p[i]+p[i+1]+p[i+2])/3>128?255:0;
   p[i]=p[i+1]=p[i+2]=v;
  }
  c.putImageData(data,0,0);
 }catch(e){}
}

/* TOUCH / PINCH */
overlay.addEventListener("pointerdown",e=>{
 if(locked||!loaded)return;
 overlay.setPointerCapture(e.pointerId);
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===2){
  const a=Array.from(pointers.values());
  pinchDist=Math.max(1,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y));
  pinchScale=scale;
  pinchX=x;
  pinchY=y;
  pinchMid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
 }
});

overlay.addEventListener("pointermove",e=>{
 if(locked||!pointers.has(e.pointerId))return;
 const prev=pointers.get(e.pointerId);
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1){
  x+=e.clientX-prev.x;
  y+=e.clientY-prev.y;
  drawReference();
 }else if(pointers.size===2&&pinchDist>0){
  const a=Array.from(pointers.values());
  const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  const mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
  scale=Math.max(fitScale*.1,Math.min(fitScale*5,pinchScale*dist/pinchDist));
  x=pinchX+mid.x-pinchMid.x;
  y=pinchY+mid.y-pinchMid.y;
  const z=Math.round(scale/fitScale*100);
  $("zoom").value=z;
  $("zoomVal").textContent=z+"%";
  drawReference();
 }
});

function endPointer(e){
 pointers.delete(e.pointerId);
 if(pointers.size<2)pinchDist=0;
}
overlay.addEventListener("pointerup",endPointer);
overlay.addEventListener("pointercancel",endPointer);

/* START */
resize();
requestAnimationFrame(drawCamera);
</script>
</body>
</html>
