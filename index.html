
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>New Tracer Gold</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  height: 100dvh;
  display: grid;
  grid-template-rows: 44px 32dvh minmax(0, 1fr);
}

header {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #b8860b;
  color: #111;
  font-weight: bold;
  font-size: 17px;
  padding: 4px;
}

#stage {
  position: relative;
  min-height: 0;
  overflow: hidden;
  background: #000;
}

#cameraCanvas {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}

#overlayCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#controls {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 10px;
  background: #202020;
}

.section {
  margin-bottom: 12px;
  padding: 10px;
  border-radius: 8px;
  background: #2b2b2b;
}

button {
  background: #c99b24;
  color: #111;
  border: 0;
  border-radius: 7px;
  padding: 12px 9px;
  font-size: 15px;
  font-weight: bold;
  margin: 3px;
}

button:active {
  background: #f2cf67;
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
}

.row button {
  flex: 1 1 110px;
}

label {
  display: block;
  margin: 7px 0;
  font-size: 14px;
}

input[type="range"] {
  width: 100%;
  margin: 8px 0;
  accent-color: #d6a629;
}

input[type="file"] {
  width: 100%;
  color: white;
  margin-top: 8px;
}

#status {
  color: #f2cf67;
  font-size: 13px;
  margin-top: 8px;
}

.small {
  font-size: 12px;
  color: #bbb;
}

@media (max-height: 650px) {
  body {
    grid-template-rows: 40px 27dvh minmax(0, 1fr);
  }

  button {
    padding: 9px 6px;
  }

  #controls {
    padding: 6px;
  }
}
</style>
</head>

<body>

<header>NEW TRACER GOLD</header>

<div id="stage">
  <canvas id="cameraCanvas"></canvas>
  <canvas id="overlayCanvas"></canvas>
</div>

<div id="controls">

  <div class="section">
    <div class="row">
      <button id="cameraBtn">📷 Start kamera</button>
      <button id="switchBtn">🔄 Skift kamera</button>
    </div>
    <div id="status">Kamera ikke startet</div>
  </div>

  <div class="section">
    <b>Referencebillede</b>
    <input type="file" id="imageInput" accept="image/*">

    <div class="row">
      <button id="fitBtn">Tilpas billede</button>
      <button id="lockBtn">🔓 Lås billede</button>
      <button id="resetBtn">Nulstil</button>
    </div>
  </div>

  <div class="section">
    <label>Reference zoom
      <input type="range" id="zoomSlider" min="0.1" max="5" step="0.01" value="1">
    </label>

    <label>Transparens
      <input type="range" id="opacitySlider" min="0" max="100" value="50">
    </label>
  </div>

  <div class="section">
    <div class="row">
      <button id="grayBtn">Gråtoner</button>
      <button id="contourBtn">Konturer</button>
    </div>
    <p class="small">
      Flyt referencebilledet med én finger. Zoom med to fingre.
      Kameraet bruges til at se papiret.
    </p>
  </div>

</div>

<script>
const cameraCanvas = document.getElementById("cameraCanvas");
const overlayCanvas = document.getElementById("overlayCanvas");
const cameraCtx = cameraCanvas.getContext("2d");
const overlayCtx = overlayCanvas.getContext("2d");

const video = document.createElement("video");
video.autoplay = true;
video.playsInline;
video.muted = true;

let stream = null;
let facingMode = "environment";

let referenceImage = null;
let imageLoaded = false;

let overlayX = 0;
let overlayY = 0;
let overlayScale = 1;
let fitScale = 1;

let opacity = 0.5;
let locked = false;
let grayscale = false;
let contours = false;

let pointers = new Map();
let pinchStartDistance = 0;
let pinchStartScale = 1;
let pinchStartCenter = null;
let pinchStartX = 0;
let pinchStartY = 0;

function resize() {
  const stage = document.getElementById("stage");
  const rect = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  cameraCanvas.width = Math.round(rect.width * dpr);
  cameraCanvas.height = Math.round(rect.height * dpr);

  overlayCanvas.width = Math.round(rect.width * dpr);
  overlayCanvas.height = Math.round(rect.height * dpr);

  cameraCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawOverlay();
}

function drawCamera() {
  if (video.readyState >= 2) {
    const w = cameraCanvas.clientWidth;
    const h = cameraCanvas.clientHeight;

    cameraCtx.clearRect(0, 0, w, h);

    const vw = video.videoWidth;
    const vh = video.videoHeight;

    if (vw && vh) {
      const scale = Math.max(w / vw, h / vh);
      const dw = vw * scale;
      const dh = vh * scale;

      cameraCtx.save();

      if (grayscale) {
        cameraCtx.filter = "grayscale(1)";
      }

      cameraCtx.drawImage(
        video,
        (w - dw) / 2,
        (h - dh) / 2,
        dw,
        dh
      );

      cameraCtx.restore();

      if (contours) {
        drawContourEffect(w, h);
      }
    }
  }

  requestAnimationFrame(drawCamera);
}

function drawContourEffect(w, h) {
  const imageData = cameraCtx.getImageData(0, 0, cameraCanvas.width, cameraCanvas.height);
  const data = imageData.data;
  const width = cameraCanvas.width;
  const height = cameraCanvas.height;

  for (let y = 1; y < height - 1; y += 3) {
    for (let x = 1; x < width - 1; x += 3) {
      const i = (y * width + x) * 4;

      const current = data[i];
      const right = data[i + 4];
      const below = data[i + width * 4];

      const diff = Math.abs(current - right) + Math.abs(current - below);

      if (diff > 55) {
        data[i] = 255;
        data[i + 1] = 210;
        data[i + 2] = 40;
        data[i + 3] = 255;
      }
    }
  }

  cameraCtx.putImageData(imageData, 0, 0);
}

function drawOverlay() {
  const w = overlayCanvas.clientWidth;
  const h = overlayCanvas.clientHeight;

  overlayCtx.clearRect(0, 0, w, h);

  if (!imageLoaded || !referenceImage) return;

  overlayCtx.save();

  overlayCtx.globalAlpha = opacity;

  const iw = referenceImage.width * overlayScale;
  const ih = referenceImage.height * overlayScale;

  overlayCtx.drawImage(
    referenceImage,
    overlayX,
    overlayY,
    iw,
    ih
  );

  overlayCtx.restore();
}

async function startCamera() {
  try {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: facingMode,
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    document.getElementById("status").textContent =
      "Kamera aktiv";

  } catch (error) {
    document.getElementById("status").textContent =
      "Kamera fejl: " + error.message;
  }
}

document.getElementById("cameraBtn").onclick = startCamera;

document.getElementById("switchBtn").onclick = async () => {
  facingMode = facingMode === "environment"
    ? "user"
    : "environment";

  await startCamera();
};

document.getElementById("imageInput").onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const img = new Image();

  img.onload = () => {
    referenceImage = img;
    imageLoaded = true;

    fitImage();
    drawOverlay();
  };

  img.src = URL.createObjectURL(file);
};

function fitImage() {
  if (!imageLoaded) return;

  const w = overlayCanvas.clientWidth;
  const h = overlayCanvas.clientHeight;

  fitScale = Math.min(
    w / referenceImage.width,
    h / referenceImage.height
  );

  overlayScale = fitScale;

  overlayX = (w - referenceImage.width * overlayScale) / 2;
  overlayY = (h - referenceImage.height * overlayScale) / 2;

  document.getElementById("zoomSlider").value = 1;

  drawOverlay();
}

document.getElementById("fitBtn").onclick = fitImage;

document.getElementById("zoomSlider").oninput = (e) => {
  if (!imageLoaded) return;

  const value = Number(e.target.value);
  const newScale = fitScale * value;

  const centerX = overlayCanvas.clientWidth / 2;
  const centerY = overlayCanvas.clientHeight / 2;

  const ratio = newScale / overlayScale;

  overlayX = centerX - (centerX - overlayX) * ratio;
  overlayY = centerY - (centerY - overlayY) * ratio;

  overlayScale = newScale;

  drawOverlay();
};

document.getElementById("opacitySlider").oninput = (e) => {
  opacity = Number(e.target.value) / 100;
  drawOverlay();
};

document.getElementById("lockBtn").onclick = () => {
  locked = !locked;

  document.getElementById("lockBtn").textContent =
    locked ? "🔒 Låst" : "🔓 Lås billede";
};

document.getElementById("resetBtn").onclick = () => {
  locked = false;
  grayscale = false;
  contours = false;

  overlayX = 0;
  overlayY = 0;
  overlayScale = 1;
  fitScale = 1;

  document.getElementById("lockBtn").textContent = "🔓 Lås billede";
  document.getElementById("grayBtn").textContent = "Gråtoner";
  document.getElementById("contourBtn").textContent = "Konturer";

  if (imageLoaded) fitImage();

  drawOverlay();
};

document.getElementById("grayBtn").onclick = () => {
  grayscale = !grayscale;

  document.getElementById("grayBtn").textContent =
    grayscale ? "Gråtoner: ON" : "Gråtoner";

};

document.getElementById("contourBtn").onclick = () => {
  contours = !contours;

  document.getElementById("contourBtn").textContent =
    contours ? "Konturer: ON" : "Konturer";
};

// Pointer control: move and zoom reference image only
overlayCanvas.addEventListener("pointerdown", (e) => {
  if (locked) return;

  overlayCanvas.setPointerCapture(e.pointerId);

  pointers.set(e.pointerId, {
    x: e.clientX,
    y: e.clientY
  });

  if (pointers.size === 2) {
    const pts = [...pointers.values()];

    pinchStartDistance = Math.hypot(
      pts[0].x - pts[1].x,
      pts[0].y - pts[1].y
    );

    pinchStartScale = overlayScale;

    pinchStartCenter = {
      x: (pts[0].x + pts[1].x) / 2,
      y: (pts[0].y + pts[1].y) / 2
    };

    pinchStartX = overlayX;
    pinchStartY = overlayY;
  }
});

overlayCanvas.addEventListener("pointermove", (e) => {
  if (locked || !pointers.has(e.pointerId)) return;

  const previous = pointers.get(e.pointerId);

  pointers.set(e.pointerId, {
    x: e.clientX,
    y: e.clientY
  });

  if (pointers.size === 1) {
    overlayX += e.clientX - previous.x;
    overlayY += e.clientY - previous.y;

    drawOverlay();
  }

  if (pointers.size === 2 && pinchStartDistance > 0) {
    const pts = [...pointers.values()];

    const distance = Math.hypot(
      pts[0].x - pts[1].x,
      pts[0].y - pts[1].y
    );

    const center = {
      x: (pts[0].x + pts[1].x) / 2,
      y: (pts[0].y + pts[1].y) / 2
    };

    const ratio = distance / pinchStartDistance;

    overlayScale = Math.max(
      fitScale * 0.1,
      Math.min(fitScale * 5, pinchStartScale * ratio)
    );

    const rect = overlayCanvas.getBoundingClientRect();

    const centerX = pinchStartCenter.x - rect.left;
    const centerY = pinchStartCenter.y - rect.top;

    overlayX = pinchStartX + (centerX - pinchStartCenter.x);
    overlayY = pinchStartY + (centerY - pinchStartCenter.y);

    document.getElementById("zoomSlider").value =
      overlayScale / fitScale;

    drawOverlay();
  }
});

function removePointer(e) {
  pointers.delete(e.pointerId);

  if (pointers.size < 2) {
    pinchStartDistance = 0;
  }
}

overlayCanvas.addEventListener("pointerup", removePointer);
overlayCanvas.addEventListener("pointercancel", removePointer);
overlayCanvas.addEventListener("pointerleave", removePointer);

window.addEventListener("resize", resize);

resize();
requestAnimationFrame(drawCamera);
</script>

</body>
</html>
