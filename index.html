
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#171717">
<title>New Tracer Gold</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

header {
  flex-shrink: 0;
  text-align: center;
  padding: 10px 5px;
  background: #1c1c1c;
  color: #d6b45b;
  font-size: 22px;
  font-weight: bold;
  border-bottom: 1px solid #333;
}

#stage {
  position: relative;
  flex: 1;
  min-height: 0;
  width: 100%;
  background: #000;
  overflow: hidden;
  touch-action: none;
}

#cameraCanvas, #overlayCanvas {
  position: absolute;
  width: 100%;
  height: 100%;
  inset: 0;
}

#cameraCanvas {
  z-index: 1;
}

#overlayCanvas {
  z-index: 2;
  touch-action: none;
}

#controls {
  flex-shrink: 0;
  background: #1a1a1a;
  padding: 8px 10px;
  overflow-y: auto;
  max-height: 43dvh;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
}

.row {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-bottom: 7px;
  width: 100%;
}

button, .fileLabel {
  flex: 1;
  min-width: 0;
  background: #292929;
  color: #e1c36c;
  border: 1px solid #b89a49;
  border-radius: 9px;
  padding: 10px 5px;
  font-size: 13px;
  font-weight: bold;
  text-align: center;
  white-space: nowrap;
}

button:active, .fileLabel:active {
  background: #51421e;
}

button.active {
  background: #4b3b17;
}

label.controlLabel {
  width: 92px;
  flex-shrink: 0;
  font-size: 13px;
  color: #ddd;
}

input[type="range"] {
  flex: 1;
  min-width: 0;
  accent-color: #d6b45b;
  height: 28px;
}

input[type="file"] {
  display: none;
}

.fileLabel {
  display: block;
}

#status {
  font-size: 12px;
  color: #d6b45b;
  padding: 2px 0 4px;
  overflow-wrap: anywhere;
}

.smallText {
  font-size: 11px;
  color: #aaa;
  padding-bottom: 2px;
}

@media (max-height: 700px) {
  header {
    padding: 7px;
    font-size: 18px;
  }

  #controls {
    max-height: 48dvh;
    padding: 6px;
  }

  button, .fileLabel {
    padding: 8px 3px;
    font-size: 12px;
  }

  .row {
    margin-bottom: 5px;
  }
}
</style>
</head>

<body>

<header>NEW TRACER GOLD</header>

<div id="stage">
  <canvas id="cameraCanvas"></canvas>
  <canvas id="overlayCanvas"></canvas>
</div>

<div id="controls">

  <div class="row">
    <button id="cameraBtn">START KAMERA</button>
    <button id="flipBtn">SKIFT KAMERA</button>
    <button id="fitBtn">TILPAS</button>
    <button id="resetBtn">RESET</button>
  </div>

  <div class="row">
    <label class="controlLabel">Kamera zoom</label>
    <input id="cameraZoom" type="range" min="1" max="5" step="0.1" value="1">
  </div>

  <div class="row">
    <label class="fileLabel" for="imageFile">VÆLG REFERENCE</label>
    <input id="imageFile" type="file" accept="image/*">
    <button id="lockBtn">LÅS</button>
  </div>

  <div class="row">
    <label class="controlLabel">Gennemsigtighed</label>
    <input id="opacity" type="range" min="0" max="100" value="50">
  </div>

  <div class="row">
    <label class="controlLabel">Reference zoom</label>
    <input id="imageZoom" type="range" min="0.2" max="5" step="0.05" value="1">
  </div>

  <div class="row">
    <button id="contourBtn">KONTUR OFF</button>
    <button id="grayBtn">GRÅTONE OFF</button>
  </div>

  <div id="status">Tryk START KAMERA og vælg dit referencebillede.</div>
  <div class="smallText">Flyt og zoom reference med fingrene. Tegn på papiret, ikke på skærmen.</div>

</div>

<script>
(() => {
"use strict";

const stage = document.getElementById("stage");
const cameraCanvas = document.getElementById("cameraCanvas");
const overlayCanvas = document.getElementById("overlayCanvas");

const cameraCtx = cameraCanvas.getContext("2d");
const overlayCtx = overlayCanvas.getContext("2d");

const cameraBtn = document.getElementById("cameraBtn");
const flipBtn = document.getElementById("flipBtn");
const fitBtn = document.getElementById("fitBtn");
const resetBtn = document.getElementById("resetBtn");
const lockBtn = document.getElementById("lockBtn");

const cameraZoom = document.getElementById("cameraZoom");
const imageZoom = document.getElementById("imageZoom");
const opacity = document.getElementById("opacity");
const imageFile = document.getElementById("imageFile");

const contourBtn = document.getElementById("contourBtn");
const grayBtn = document.getElementById("grayBtn");
const status = document.getElementById("status");

let video = document.createElement("video");
video.autoplay = true;
video.playsInline = true;
video.muted = true;

let stream = null;
let facingMode = "environment";

let referenceImage = null;
let referenceLoaded = false;

let overlayX = 0;
let overlayY = 0;
let baseScale = 1;
let overlayScale = 1;

let locked = false;
let contours = false;
let grayscale = false;

let stageWidth = 0;
let stageHeight = 0;
let dpr = 1;

let pointers = new Map();
let lastDrag = null;
let pinchStartDistance = 0;
let pinchStartScale = 1;
let pinchStartCenter = null;

function message(text) {
  status.textContent = text;
}

function resizeCanvases() {
  const rect = stage.getBoundingClientRect();

  stageWidth = rect.width;
  stageHeight = rect.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);

  cameraCanvas.width = Math.round(stageWidth * dpr);
  cameraCanvas.height = Math.round(stageHeight * dpr);

  overlayCanvas.width = Math.round(stageWidth * dpr);
  overlayCanvas.height = Math.round(stageHeight * dpr);

  cameraCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  renderOverlay();
}

window.addEventListener("resize", resizeCanvases);
resizeCanvases();

/* CAMERA */

function renderCamera() {
  if (video.readyState >= 2 && video.videoWidth > 0) {
    const vw = video.videoWidth;
    const vh = video.videoHeight;

    const zoom = Number(cameraZoom.value);
    const targetAspect = stageWidth / stageHeight;
    const videoAspect = vw / vh;

    let cropW, cropH;

    if (videoAspect > targetAspect) {
      cropH = vh;
      cropW = vh * targetAspect;
    } else {
      cropW = vw;
      cropH = vw / targetAspect;
    }

    cropW /= zoom;
    cropH /= zoom;

    const sx = (vw - cropW) / 2;
    const sy = (vh - cropH) / 2;

    cameraCtx.clearRect(0, 0, stageWidth, stageHeight);

    cameraCtx.save();

    if (grayscale) {
      cameraCtx.filter = "grayscale(100%)";
    } else {
      cameraCtx.filter = "none";
    }

    cameraCtx.drawImage(
      video,
      sx, sy, cropW, cropH,
      0, 0, stageWidth, stageHeight
    );

    cameraCtx.restore();

    if (contours) {
      drawContours();
    }
  }

  requestAnimationFrame(renderCamera);
}

function drawContours() {
  try {
    const w = Math.floor(stageWidth);
    const h = Math.floor(stageHeight);

    if (!w || !h) return;

    const imageData = cameraCtx.getImageData(0, 0, w, h);
    const data = imageData.data;

    for (let y = 2; y < h - 2; y += 2) {
      for (let x = 2; x < w - 2; x += 2) {
        const i = (y * w + x) * 4;
        const left = (y * w + (x - 2)) * 4;
        const right = (y * w + (x + 2)) * 4;
        const up = ((y - 2) * w + x) * 4;
        const down = ((y + 2) * w + x) * 4;

        const edge =
          Math.abs(data[left] - data[right]) +
          Math.abs(data[up] - data[down]);

        if (edge > 90) {
          data[i] = 255;
          data[i + 1] = 210;
          data[i + 2] = 80;
          data[i + 3] = 255;
        }
      }
    }

    cameraCtx.putImageData(imageData, 0, 0);
  } catch (error) {
    // Konturer slås blot fra hvis enheden ikke understøtter behandlingen.
  }
}

/* REFERENCE IMAGE */

function renderOverlay() {
  overlayCtx.clearRect(0, 0, stageWidth, stageHeight);

  if (!referenceLoaded || !referenceImage) return;

  overlayCtx.save();
  overlayCtx.globalAlpha = Number(opacity.value) / 100;

  const drawW = referenceImage.width * overlayScale;
  const drawH = referenceImage.height * overlayScale;

  overlayCtx.drawImage(
    referenceImage,
    overlayX,
    overlayY,
    drawW,
    drawH
  );

  overlayCtx.restore();
}

function fitImage() {
  if (!referenceLoaded) return;

  const scaleX = stageWidth * 0.9 / referenceImage.width;
  const scaleY = stageHeight * 0.9 / referenceImage.height;

  baseScale = Math.min(scaleX, scaleY);
  overlayScale = baseScale;

  imageZoom.value = 1;

  overlayX = (stageWidth - referenceImage.width * overlayScale) / 2;
  overlayY = (stageHeight - referenceImage.height * overlayScale) / 2;

  renderOverlay();
}

function resetImage() {
  if (!referenceLoaded) return;

  locked = false;
  lockBtn.textContent = "LÅS";
  lockBtn.classList.remove("active");

  fitImage();
}

imageFile.addEventListener("change", (event) => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = () => {
    referenceImage = img;
    referenceLoaded = true;

    fitImage();
    message("Referencebillede indlæst.");

    URL.revokeObjectURL(url);
  };

  img.onerror = () => {
    message("Kunne ikke åbne billedet.");
    URL.revokeObjectURL(url);
  };

  img.src = url;
});

opacity.addEventListener("input", renderOverlay);

imageZoom.addEventListener("input", () => {
  if (!referenceLoaded || locked) return;

  const requested = Number(imageZoom.value);
  const newScale = baseScale * requested;

  const centerX = overlayX + referenceImage.width * overlayScale / 2;
  const centerY = overlayY + referenceImage.height * overlayScale / 2;

  overlayScale = newScale;

  overlayX = centerX - referenceImage.width * overlayScale / 2;
  overlayY = centerY - referenceImage.height * overlayScale / 2;

  renderOverlay();
});

lockBtn.addEventListener("click", () => {
  locked = !locked;
  lockBtn.textContent = locked ? "LÅST" : "LÅS";
  lockBtn.classList.toggle("active", locked);
  message(locked ? "Reference låst." : "Reference låst op.");
});

fitBtn.addEventListener("click", fitImage);
resetBtn.addEventListener("click", resetImage);

/* CAMERA CONTROLS */

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    message("Kamera kræver HTTPS og en understøttet browser.");
    return;
  }

  cameraBtn.textContent = "STARTER...";
  cameraBtn.disabled = true;

  try {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = stream;

    await new Promise((resolve, reject) => {
      video.onloadedmetadata = resolve;
      video.onerror = reject;
    });

    await video.play();

    cameraBtn.textContent = "KAMERA OK";
    message("Kamera startet.");

  } catch (error) {
    cameraBtn.textContent = "START KAMERA";
    message("Kamera fejl: " + (error.message || error.name));
  } finally {
    cameraBtn.disabled = false;
  }
}

cameraBtn.addEventListener("click", startCamera);

flipBtn.addEventListener("click", async () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  await startCamera();
});

cameraZoom.addEventListener("input", () => {});

contourBtn.addEventListener("click", () => {
  contours = !contours;
  contourBtn.textContent = contours ? "KONTUR ON" : "KONTUR OFF";
  contourBtn.classList.toggle("active", contours);
});

grayBtn.addEventListener("click", () => {
  grayscale = !grayscale;
  grayBtn.textContent = grayscale ? "GRÅTONE ON" : "GRÅTONE OFF";
  grayBtn.classList.toggle("active", grayscale);
});

/* FINGER MOVE / PINCH ZOOM
   Kun referencebilledet bevæges.
   Ingen tegning på skærmen. */

function pointerDistance(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

function pointerCenter(a, b) {
  return {
    x: (a.x + b.x) / 2,
    y: (a.y + b.y) / 2
  };
}

function getPosition(event) {
  const rect = overlayCanvas.getBoundingClientRect();
  return {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  };
}

overlayCanvas.addEventListener("pointerdown", (event) => {
  event.preventDefault();

  overlayCanvas.setPointerCapture(event.pointerId);

  const pos = getPosition(event);
  pointers.set(event.pointerId, pos);

  if (pointers.size === 1) {
    lastDrag = pos;
  }

  if (pointers.size === 2) {
    const pts = Array.from(pointers.values());

    pinchStartDistance = pointerDistance(pts[0], pts[1]);
    pinchStartScale = overlayScale;
    pinchStartCenter = pointerCenter(pts[0], pts[1]);
  }
});

overlayCanvas.addEventListener("pointermove", (event) => {
  if (!pointers.has(event.pointerId)) return;
  event.preventDefault();

  const pos = getPosition(event);
  pointers.set(event.pointerId, pos);

  if (locked || !referenceLoaded) return;

  if (pointers.size === 1 && lastDrag) {
    overlayX += pos.x - lastDrag.x;
    overlayY += pos.y - lastDrag.y;
    lastDrag = pos;

    renderOverlay();
  }

  if (pointers.size === 2) {
    const pts = Array.from(pointers.values());
    const dist = pointerDistance(pts[0], pts[1]);
    const center = pointerCenter(pts[0], pts[1]);

    if (pinchStartDistance > 0) {
      const factor = dist / pinchStartDistance;
      const newScale = Math.max(0.05, Math.min(10, pinchStartScale * factor));

      const oldCenterX = overlayX + referenceImage.width * overlayScale / 2;
      const oldCenterY = overlayY + referenceImage.height * overlayScale / 2;

      overlayScale = newScale;

      overlayX = oldCenterX - referenceImage.width * overlayScale / 2;
      overlayY = oldCenterY - referenceImage.height * overlayScale / 2;

      overlayX += center.x - pinchStartCenter.x;
      overlayY += center.y - pinchStartCenter.y;

      renderOverlay();
    }
  }
});

function endPointer(event) {
  pointers.delete(event.pointerId);

  if (pointers.size === 1) {
    lastDrag = Array.from(pointers.values())[0];
  } else {
    lastDrag = null;
    pinchStartDistance = 0;
  }
}

overlayCanvas.addEventListener("pointerup", endPointer);
overlayCanvas.addEventListener("pointercancel", endPointer);

requestAnimationFrame(renderCamera);

})();
</script>

</body>
</html>
