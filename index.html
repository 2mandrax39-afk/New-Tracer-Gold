
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#171717">
<title>New Tracer Gold</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  height: 52px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1b1b1b;
  color: #d6b45b;
  font-weight: bold;
  font-size: 21px;
}

#stage {
  height: 42dvh;
  min-height: 160px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  background: #000;
  touch-action: none;
}

#cameraCanvas,
#overlayCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#cameraCanvas {
  z-index: 1;
}

#overlayCanvas {
  z-index: 2;
  touch-action: none;
}

#controls {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  background: #1a1a1a;
  padding: 8px 10px 12px;
}

.row {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  margin-bottom: 8px;
}

button,
.fileLabel {
  min-width: 0;
  flex: 1;
  background: #292929;
  color: #e1c36c;
  border: 1px solid #b89a49;
  border-radius: 9px;
  padding: 11px 4px;
  font-size: 12px;
  font-weight: bold;
  text-align: center;
}

button:active,
.fileLabel:active {
  background: #51421e;
}

button.active {
  background: #51421e;
}

button:disabled {
  opacity: 0.6;
}

.controlLabel {
  width: 100px;
  flex-shrink: 0;
  font-size: 12px;
  color: #ddd;
}

input[type="range"] {
  flex: 1;
  width: 0;
  min-width: 0;
  height: 30px;
  accent-color: #d6b45b;
}

input[type="file"] {
  display: none;
}

.fileLabel {
  display: block;
}

#status {
  color: #d6b45b;
  font-size: 12px;
  padding: 4px 0;
  overflow-wrap: anywhere;
}

.smallText {
  font-size: 11px;
  color: #aaa;
  padding-bottom: 5px;
}

@media (max-height: 650px) {
  header {
    height: 42px;
    font-size: 18px;
  }

  #stage {
    height: 36dvh;
    min-height: 130px;
  }

  button,
  .fileLabel {
    padding: 8px 3px;
    font-size: 11px;
  }

  .row {
    margin-bottom: 5px;
  }
}
</style>
</head>

<body>

<header>NEW TRACER GOLD</header>

<div id="stage">
  <canvas id="cameraCanvas"></canvas>
  <canvas id="overlayCanvas"></canvas>
</div>

<div id="controls">

  <div class="row">
    <button id="cameraBtn">START KAMERA</button>
    <button id="flipBtn">SKIFT KAMERA</button>
  </div>

  <div class="row">
    <button id="fitBtn">TILPAS</button>
    <button id="resetBtn">RESET</button>
    <button id="lockBtn">LÅS REFERENCE</button>
  </div>

  <div class="row">
    <label class="controlLabel">Kamera zoom</label>
    <input id="cameraZoom" type="range" min="1" max="5" step="0.1" value="1">
  </div>

  <div class="row">
    <label class="fileLabel" for="imageFile">VÆLG REFERENCEBILLEDE</label>
    <input id="imageFile" type="file" accept="image/*">
  </div>

  <div class="row">
    <label class="controlLabel">Gennemsigtighed</label>
    <input id="opacity" type="range" min="0" max="100" value="50">
  </div>

  <div class="row">
    <label class="controlLabel">Reference zoom</label>
    <input id="imageZoom" type="range" min="0.2" max="5" step="0.05" value="1">
  </div>

  <div class="row">
    <button id="contourBtn">KONTUR OFF</button>
    <button id="grayBtn">GRÅTONE OFF</button>
  </div>

  <div id="status">Tryk START KAMERA.</div>

  <div class="smallText">
    Flyt og zoom referencebilledet med fingrene.
    Tegn på papiret, ikke på telefonen.
  </div>

</div>

<script>
(() => {
"use strict";

/* ELEMENTS */

const stage = document.getElementById("stage");
const cameraCanvas = document.getElementById("cameraCanvas");
const overlayCanvas = document.getElementById("overlayCanvas");

const cameraCtx = cameraCanvas.getContext("2d");
const overlayCtx = overlayCanvas.getContext("2d");

const cameraBtn = document.getElementById("cameraBtn");
const flipBtn = document.getElementById("flipBtn");
const fitBtn = document.getElementById("fitBtn");
const resetBtn = document.getElementById("resetBtn");
const lockBtn = document.getElementById("lockBtn");

const cameraZoom = document.getElementById("cameraZoom");
const imageZoom = document.getElementById("imageZoom");
const opacity = document.getElementById("opacity");
const imageFile = document.getElementById("imageFile");

const contourBtn = document.getElementById("contourBtn");
const grayBtn = document.getElementById("grayBtn");
const status = document.getElementById("status");

/* STATE */

let video = document.createElement("video");
video.autoplay = true;
video.playsInline = true;
video.muted = true;

let stream = null;
let facingMode = "environment";

let referenceImage = null;
let referenceLoaded = false;

let overlayX = 0;
let overlayY = 0;
let overlayScale = 1;
let fitScale = 1;

let locked = false;
let contours = false;
let grayscale = false;

let width = 0;
let height = 0;
let pixelRatio = 1;

let pointers = new Map();
let lastDrag = null;
let pinchDistanceStart = 0;
let pinchScaleStart = 1;
let pinchCenterStart = null;

/* STATUS */

function setStatus(text) {
  status.textContent = text;
}

/* CANVAS SIZE */

function resize() {
  const rect = stage.getBoundingClientRect();

  width = rect.width;
  height = rect.height;
  pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

  cameraCanvas.width = Math.round(width * pixelRatio);
  cameraCanvas.height = Math.round(height * pixelRatio);

  overlayCanvas.width = Math.round(width * pixelRatio);
  overlayCanvas.height = Math.round(height * pixelRatio);

  cameraCtx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  overlayCtx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

  drawOverlay();
}

window.addEventListener("resize", resize);

/* CAMERA RENDER */

function drawCamera() {
  if (video.readyState >= 2 && video.videoWidth && video.videoHeight) {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const zoom = Number(cameraZoom.value);

    const aspect = width / height;
    const videoAspect = vw / vh;

    let cropWidth;
    let cropHeight;

    if (videoAspect > aspect) {
      cropHeight = vh;
      cropWidth = vh * aspect;
    } else {
      cropWidth = vw;
      cropHeight = vw / aspect;
    }

    cropWidth /= zoom;
    cropHeight /= zoom;

    const sx = (vw - cropWidth) / 2;
    const sy = (vh - cropHeight) / 2;

    cameraCtx.clearRect(0, 0, width, height);

    cameraCtx.save();

    cameraCtx.filter = grayscale ? "grayscale(100%)" : "none";

    cameraCtx.drawImage(
      video,
      sx, sy, cropWidth, cropHeight,
      0, 0, width, height
    );

    cameraCtx.restore();

    if (contours) {
      drawContourEffect();
    }
  }

  requestAnimationFrame(drawCamera);
}

/* CONTOUR EFFECT */

function drawContourEffect() {
  try {
    const w = Math.floor(width);
    const h = Math.floor(height);

    if (!w || !h) return;

    const imageData = cameraCtx.getImageData(0, 0, w, h);
    const data = imageData.data;

    for (let y = 2; y < h - 2; y += 3) {
      for (let x = 2; x < w - 2; x += 3) {
        const index = (y * w + x) * 4;

        const left = (y * w + x - 2) * 4;
        const right = (y * w + x + 2) * 4;
        const up = ((y - 2) * w + x) * 4;
        const down = ((y + 2) * w + x) * 4;

        const edge =
          Math.abs(data[left] - data[right]) +
          Math.abs(data[up] - data[down]);

        if (edge > 90) {
          data[index] = 255;
          data[index + 1] = 210;
          data[index + 2] = 80;
          data[index + 3] = 255;
        }
      }
    }

    cameraCtx.putImageData(imageData, 0, 0);

  } catch (e) {
    // Konturer springes over, hvis enheden ikke understøtter det.
  }
}

/* REFERENCE */

function drawOverlay() {
  overlayCtx.clearRect(0, 0, width, height);

  if (!referenceLoaded || !referenceImage) return;

  overlayCtx.save();
  overlayCtx.globalAlpha = Number(opacity.value) / 100;

  overlayCtx.drawImage(
    referenceImage,
    overlayX,
    overlayY,
    referenceImage.width * overlayScale,
    referenceImage.height * overlayScale
  );

  overlayCtx.restore();
}

function fitReference() {
  if (!referenceLoaded) return;

  const scaleX = width * 0.90 / referenceImage.width;
  const scaleY = height * 0.90 / referenceImage.height;

  fitScale = Math.min(scaleX, scaleY);
  overlayScale = fitScale;

  imageZoom.value = 1;

  overlayX = (width - referenceImage.width * overlayScale) / 2;
  overlayY = (height - referenceImage.height * overlayScale) / 2;

  drawOverlay();
}

function resetReference() {
  if (!referenceLoaded) return;

  locked = false;
  lockBtn.textContent = "LÅS REFERENCE";
  lockBtn.classList.remove("active");

  fitReference();
}

/* LOAD IMAGE */

imageFile.addEventListener("change", event => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = () => {
    referenceImage = img;
    referenceLoaded = true;

    fitReference();
    setStatus("Referencebillede indlæst.");

    URL.revokeObjectURL(url);
  };

  img.onerror = () => {
    setStatus("Fejl ved indlæsning af billede.");
    URL.revokeObjectURL(url);
  };

  img.src = url;
});

/* SLIDERS */

opacity.addEventListener("input", drawOverlay);

imageZoom.addEventListener("input", () => {
  if (!referenceLoaded || locked) return;

  const multiplier = Number(imageZoom.value);
  const newScale = fitScale * multiplier;

  const centerX = overlayX + referenceImage.width * overlayScale / 2;
  const centerY = overlayY + referenceImage.height * overlayScale / 2;

  overlayScale = newScale;

  overlayX = centerX - referenceImage.width * overlayScale / 2;
  overlayY = centerY - referenceImage.height * overlayScale / 2;

  drawOverlay();
});

/* LOCK */

lockBtn.addEventListener("click", () => {
  locked = !locked;

  lockBtn.textContent = locked ? "REFERENCE LÅST" : "LÅS REFERENCE";
  lockBtn.classList.toggle("active", locked);

  setStatus(locked ? "Reference låst." : "Reference låst op.");
});

/* BUTTONS */

fitBtn.addEventListener("click", fitReference);
resetBtn.addEventListener("click", resetReference);

contourBtn.addEventListener("click", () => {
  contours = !contours;

  contourBtn.textContent = contours ? "KONTUR ON" : "KONTUR OFF";
  contourBtn.classList.toggle("active", contours);
});

grayBtn.addEventListener("click", () => {
  grayscale = !grayscale;

  grayBtn.textContent = grayscale ? "GRÅTONE ON" : "GRÅTONE OFF";
  grayBtn.classList.toggle("active", grayscale);
});

/* CAMERA START */

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus("Kamera kræver HTTPS.");
    return;
  }

  cameraBtn.disabled = true;
  cameraBtn.textContent = "STARTER KAMERA...";

  try {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = stream;

    await video.play();

    cameraBtn.textContent = "KAMERA AKTIV";
    setStatus("Kamera startet.");

  } catch (error) {
    cameraBtn.textContent = "START KAMERA";
    setStatus("Kamera fejl: " + error.message);

  } finally {
    cameraBtn.disabled = false;
  }
}

cameraBtn.addEventListener("click", startCamera);

flipBtn.addEventListener("click", async () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  await startCamera();
});

/* POINTER / TOUCH CONTROL */

function distance(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

function center(a, b) {
  return {
    x: (a.x + b.x) / 2,
    y: (a.y + b.y) / 2
  };
}

function pointerPosition(event) {
  const rect = overlayCanvas.getBoundingClientRect();

  return {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  };
}

overlayCanvas.addEventListener("pointerdown", event => {
  event.preventDefault();

  overlayCanvas.setPointerCapture(event.pointerId);

  const pos = pointerPosition(event);
  pointers.set(event.pointerId, pos);

  if (pointers.size === 1) {
    lastDrag = pos;
  }

  if (pointers.size === 2) {
    const pts = Array.from(pointers.values());

    pinchDistanceStart = distance(pts[0], pts[1]);
    pinchScaleStart = overlayScale;
    pinchCenterStart = center(pts[0], pts[1]);
  }
});

overlayCanvas.addEventListener("pointermove", event => {
  if (!pointers.has(event.pointerId)) return;

  event.preventDefault();

  const pos = pointerPosition(event);
  pointers.set(event.pointerId, pos);

  if (locked || !referenceLoaded) return;

  /* ONE FINGER: MOVE IMAGE */

  if (pointers.size === 1 && lastDrag) {
    overlayX += pos.x - lastDrag.x;
    overlayY += pos.y - lastDrag.y;

    lastDrag = pos;

    drawOverlay();
  }

  /* TWO FINGERS: ZOOM AND MOVE */

  if (pointers.size === 2) {
    const pts = Array.from(pointers.values());

    const currentDistance = distance(pts[0], pts[1]);
    const currentCenter = center(pts[0], pts[1]);

    if (pinchDistanceStart > 0) {
      const factor = currentDistance / pinchDistanceStart;

      overlayScale = Math.max(
        0.05,
        Math.min(10, pinchScaleStart * factor)
      );

      overlayX += currentCenter.x - pinchCenterStart.x;
      overlayY += currentCenter.y - pinchCenterStart.y;

      drawOverlay();
    }
  }
});

function pointerEnd(event) {
  pointers.delete(event.pointerId);

  if (pointers.size === 1) {
    lastDrag = Array.from(pointers.values())[0];
  } else {
    lastDrag = null;
    pinchDistanceStart = 0;
  }
}

overlayCanvas.addEventListener("pointerup", pointerEnd);
overlayCanvas.addEventListener("pointercancel", pointerEnd);

/* INIT */

resize();
requestAnimationFrame(drawCamera);

})();
</script>

</body>
</html>
