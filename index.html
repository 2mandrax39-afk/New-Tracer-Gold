
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>New Tracer Gold</title>
<style>
:root {
  --gold: #c9a227;
  --goldLight: #e2c45b;
  --bg: #050505;
  --panel: #101010;
  --border: #29220f;
}
* { box-sizing:border-box; }
html,body {
  margin:0; width:100%; height:100%;
  overflow:hidden; background:var(--bg); color:var(--gold);
  font-family:Arial,sans-serif;
}
body {
  height:100dvh;
  display:flex; flex-direction:column;
}
button {
  background:#0c0c0c;
  color:var(--gold);
  border:1px solid #6d5517;
  border-radius:7px;
  padding:7px 9px;
  font-size:12px;
  font-weight:600;
  min-height:34px;
}
button.active {
  background:var(--gold);
  color:#000;
  border-color:var(--goldLight);
}
button:active { opacity:.75; }
input[type=file] { display:none; }
input[type=range] {
  width:100%; height:18px; margin:3px 0;
  accent-color:var(--gold);
}

/* Compact top */
#top {
  flex-shrink:0;
  padding:5px 7px;
  background:#080808;
  border-bottom:1px solid var(--border);
}
#title {
  text-align:center;
  font-size:13px;
  font-weight:bold;
  letter-spacing:2px;
  padding:3px 0 6px;
  color:var(--goldLight);
}
.toolbar {
  display:flex; gap:5px;
  justify-content:center; flex-wrap:wrap;
}
.toolbar button { flex:1; }

/* Camera centered */
#stage {
  position:relative;
  flex:0 0 38dvh;
  min-height:0;
  background:#000;
  overflow:hidden;
  border-bottom:1px solid #33270c;
  border-top:1px solid #33270c;
}
canvas { width:100%; height:100%; display:block; }
#overlay {
  position:absolute; inset:0;
  touch-action:none;
}

/* Bottom controls */
#bottom {
  flex:1 1 0; min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:5px;
  background:#050505;
}
.toolrow {
  display:flex; flex-wrap:wrap; gap:4px;
}
.toolrow button { flex:1 1 auto; }
.panel {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  padding:7px 8px;
  margin-bottom:5px;
}
.panelTitle {
  color:#8d7326;
  font-size:10px;
  letter-spacing:1px;
  margin-bottom:5px;
}
.slider {
  margin:4px 0 6px;
}
.sliderHead {
  display:flex; justify-content:space-between;
  font-size:11px; color:#c9a227;
}
#status {
  text-align:center;
  font-size:10px;
  color:#80703b;
  padding:3px;
}
@media(max-height:700px) {
  #stage { flex-basis:32dvh; }
  button { min-height:30px; padding:5px; font-size:11px; }
  #top { padding:3px 5px; }
}
</style>
</head>
<body>

<div id="top">
  <div id="title">NEW TRACER GOLD</div>
  <div class="toolbar">
    <button id="cam">📷 Kamera</button>
    <button id="switch">↔ Kamera</button>
    <button id="pick">▣ Billede</button>
    <button id="fit">Fit</button>
    <button id="lock">🔓 Lås</button>
  </div>
  <input type="file" id="file" accept="image/*">
</div>

<div id="stage">
  <canvas id="camera"></canvas>
  <canvas id="overlay"></canvas>
</div>

<div id="bottom">

  <div class="panel">
    <div class="panelTitle">BILLEDEFILTER</div>
    <div class="toolrow">
      <button id="bw">Sort/Hvid</button>
      <button id="gray">Gråtoner</button>
      <button id="pencil">Blyant</button>
      <button id="contours">Konturer</button>
      <button id="edges">Kanter</button>
    </div>
  </div>

  <div class="panel">
    <div class="panelTitle">REFERENCE & KAMERA</div>

    <div class="slider">
      <div class="sliderHead">
        <span>Reference zoom</span><span id="zoomLabel">100%</span>
      </div>
      <input id="zoom" type="range" min="10" max="500" value="100">
    </div>

    <div class="slider">
      <div class="sliderHead">
        <span>Transparens</span><span id="opacityLabel">50%</span>
      </div>
      <input id="opacity" type="range" min="0" max="100" value="50">
    </div>

    <div class="slider">
      <div class="sliderHead">
        <span>Kamera zoom</span><span id="camZoomLabel">1.0×</span>
      </div>
      <input id="camZoom" type="range" min="1" max="5" step="0.1" value="1">
    </div>

    <div class="slider">
      <div class="sliderHead">
        <span>Kontrast</span><span id="contrastLabel">100%</span>
      </div>
      <input id="contrast" type="range" min="50" max="250" value="100">
    </div>
  </div>

  <div class="panel">
    <div class="panelTitle">POSITION</div>
    <div class="toolrow">
      <button id="center">⊙ Center</button>
      <button id="reset">↺ Nulstil</button>
    </div>
  </div>

  <div id="status">Klar</div>
</div>

<script>
const camCanvas=document.getElementById("camera");
const overlayCanvas=document.getElementById("overlay");
const cctx=camCanvas.getContext("2d",{willReadFrequently:true});
const octx=overlayCanvas.getContext("2d");

const video=document.createElement("video");
video.playsInline=true;
video.muted=true;
video.autoplay=true;

let stream=null, facing="environment", cameraOn=false;
let image=null, loaded=false, locked=false;
let x=0,y=0,scale=1,fitScale=1,opacity=.5;
let mode="normal", contrast=100, camZoom=1;
let pointers=new Map(), pinchDistance=0,pinchScale=1;
let pinchX=0,pinchY=0,pinchMid=null;

const status=document.getElementById("status");
const $=id=>document.getElementById(id);
function say(t){status.textContent=t;}

function resize(){
  const r=$("stage").getBoundingClientRect();
  const d=Math.min(devicePixelRatio||1,2);
  camCanvas.width=Math.max(1,Math.round(r.width*d));
  camCanvas.height=Math.max(1,Math.round(r.height*d));
  overlayCanvas.width=camCanvas.width;
  overlayCanvas.height=camCanvas.height;
  cctx.setTransform(d,0,0,d,0,0);
  octx.setTransform(d,0,0,d,0,0);
  drawReference();
}
window.addEventListener("resize",resize);

async function startCamera(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    say("Starter kamera...");
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    cameraOn=true;
    say("Kamera aktiv");
  }catch(e){
    say("Kamera kunne ikke startes");
  }
}
$("cam").onclick=startCamera;
$("switch").onclick=()=>{
  facing=facing==="environment"?"user":"environment";
  startCamera();
};

/* Select reference */
$("pick").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files?.[0];
  if(!f)return;
  const im=new Image();
  im.onload=()=>{
    image=im;loaded=true;
    fitImage();
    say("Reference indlæst");
  };
  im.onerror=()=>say("Fejl ved billedet");
  im.src=URL.createObjectURL(f);
};

function fitImage(){
  if(!loaded)return;
  const w=overlayCanvas.clientWidth,h=overlayCanvas.clientHeight;
  fitScale=Math.min(w/image.width,h/image.height);
  scale=fitScale;
  x=(w-image.width*scale)/2;
  y=(h-image.height*scale)/2;
  $("zoom").value=100;
  $("zoomLabel").textContent="100%";
  drawReference();
}
$("fit").onclick=fitImage;

function drawReference(){
  const w=overlayCanvas.clientWidth,h=overlayCanvas.clientHeight;
  octx.clearRect(0,0,w,h);
  if(!loaded||!image)return;
  octx.save();
  octx.globalAlpha=opacity;
  octx.drawImage(image,x,y,image.width*scale,image.height*scale);
  octx.restore();
}

/* Reference zoom */
$("zoom").oninput=e=>{
  if(!loaded)return;
  const newScale=fitScale*(Number(e.target.value)/100);
  const cx=overlayCanvas.clientWidth/2,cy=overlayCanvas.clientHeight/2;
  const ratio=newScale/scale;
  x=cx-(cx-x)*ratio;
  y=cy-(cy-y)*ratio;
  scale=newScale;
  $("zoomLabel").textContent=e.target.value+"%";
  drawReference();
};

/* Opacity */
$("opacity").oninput=e=>{
  opacity=Number(e.target.value)/100;
  $("opacityLabel").textContent=e.target.value+"%";
  drawReference();
};

/* Camera zoom */
$("camZoom").oninput=e=>{
  camZoom=Number(e.target.value);
  $("camZoomLabel").textContent=camZoom.toFixed(1)+"×";
};
$("contrast").oninput=e=>{
  contrast=Number(e.target.value);
  $("contrastLabel").textContent=contrast+"%";
};

/* Lock */
$("lock").onclick=()=>{
  locked=!locked;
  $("lock").textContent=locked?"🔒 Låst":"🔓 Lås";
  $("lock").classList.toggle("active",locked);
};

/* Center */
$("center").onclick=()=>{
  if(!loaded)return;
  x=(overlayCanvas.clientWidth-image.width*scale)/2;
  y=(overlayCanvas.clientHeight-image.height*scale)/2;
  drawReference();
};

/* Reset */
$("reset").onclick=()=>{
  mode="normal";
  camZoom=1;
  contrast=100;
  locked=false;
  $("camZoom").value=1;
  $("camZoomLabel").textContent="1.0×";
  $("contrast").value=100;
  $("contrastLabel").textContent="100%";
  $("lock").textContent="🔓 Lås";
  document.querySelectorAll(".toolrow button").forEach(b=>b.classList.remove("active"));
  if(loaded)fitImage();
  drawReference();
};

/* Modes */
function setMode(m){
  mode=mode===m?"normal":m;
  ["bw","gray","pencil","contours","edges"].forEach(id=>{
    $(id).classList.toggle("active",mode===id);
  });
}
$("bw").onclick=()=>setMode("bw");
$("gray").onclick=()=>setMode("gray");
$("pencil").onclick=()=>setMode("pencil");
$("contours").onclick=()=>setMode("contours");
$("edges").onclick=()=>setMode("edges");

/* Camera drawing */
function drawCamera(){
  const w=camCanvas.clientWidth,h=camCanvas.clientHeight;
  cctx.clearRect(0,0,w,h);

  if(cameraOn&&video.readyState>=2&&video.videoWidth){
    const base=Math.max(w/video.videoWidth,h/video.videoHeight);
    const s=base*camZoom;
    const dw=video.videoWidth*s,dh=video.videoHeight*s;
    const dx=(w-dw)/2,dy=(h-dh)/2;

    cctx.save();
    let filters=[];
    if(mode==="bw")filters.push("grayscale(1)");
    if(mode==="gray"||mode==="pencil"||mode==="contours"||mode==="edges")
      filters.push("grayscale(1)");
    filters.push("contrast("+contrast+"%)");
    cctx.filter=filters.join(" ");
    cctx.drawImage(video,dx,dy,dw,dh);
    cctx.restore();

    if(mode==="bw")threshold();
    if(mode==="pencil"||mode==="contours"||mode==="edges")edgeEffect();
  }
  requestAnimationFrame(drawCamera);
}

/* Black and white threshold */
function threshold(){
  try{
    const d=cameraCanvas.width,h=cameraCanvas.height;
    const img=cctx.getImageData(0,0,d,h);
    const p=img.data;
    for(let i=0;i<p.length;i+=4){
      const v=(p[i]+p[i+1]+p[i+2])/3>128?255:0;
      p[i]=p[i+1]=p[i+2]=v;
    }
    cctx.putImageData(img,0,0);
  }catch(e){}
}

/* Edge effect */
function edgeEffect(){
  try{
    const w=camCanvas.width,h=camCanvas.height;
    const img=cctx.getImageData(0,0,w,h);
    const p=img.data;
    const step=3;
    for(let yy=step;yy<h-step;yy+=step){
      for(let xx=step;xx<w-step;xx+=step){
        const i=(yy*w+xx)*4;
        const ir=(yy*w+xx+step)*4;
        const ib=((yy+step)*w+xx)*4;
        const dif=Math.abs(p[i]-p[ir])+Math.abs(p[i]-p[ib]);
        if(dif>45){
          if(mode==="pencil"){
            p[i]=p[i+1]=p[i+2]=20;
          }else{
            p[i]=225;p[i+1]=190;p[i+2]=70;
          }
          p[i+3]=255;
        }
      }
    }
    cctx.putImageData(img,0,0);
  }catch(e){}
}

/* Finger movement and pinch zoom of reference */
overlayCanvas.addEventListener("pointerdown",e=>{
  if(locked||!loaded)return;
  overlayCanvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const a=[...pointers.values()];
    pinchDistance=Math.max(1,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y));
    pinchScale=scale;pinchX=x;pinchY=y;
    pinchMid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
  }
});

overlayCanvas.addEventListener("pointermove",e=>{
  if(locked||!pointers.has(e.pointerId))return;
  const prev=pointers.get(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(pointers.size===1){
    x+=e.clientX-prev.x;
    y+=e.clientY-prev.y;
    drawReference();
  }else if(pointers.size===2&&pinchDistance){
    const a=[...pointers.values()];
    const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    const mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
    scale=Math.max(fitScale*.1,Math.min(fitScale*5,pinchScale*dist/pinchDistance));
    x=pinchX+(mid.x-pinchMid.x);
    y=pinchY+(mid.y-pinchMid.y);
    $("zoom").value=Math.round(scale/fitScale*100);
    $("zoomLabel").textContent=Math.round(scale/fitScale*100)+"%";
    drawReference();
  }
});

function pointerEnd(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2)pinchDistance=0;
}
overlayCanvas.addEventListener("pointerup",pointerEnd);
overlayCanvas.addEventListener("pointercancel",pointerEnd);

resize();
requestAnimationFrame(drawCamera);
</script>
</body>
</html>
