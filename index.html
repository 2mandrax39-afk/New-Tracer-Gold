
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New Tracer Gold</title>

<style>
*{box-sizing:border-box}

:root{
  --gold:#d4af37;
  --dark:#050505;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--dark);
  color:var(--gold);
  font-family:Arial,sans-serif;
}

body{
  height:100dvh;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
}

/* TOP */
#top{
  padding:5px;
  background:#050505;
  border-bottom:1px solid #392b0c;
}

#title{
  text-align:center;
  font-size:15px;
  font-weight:bold;
  letter-spacing:3px;
  padding:5px;
}

.toolbar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}

/* BUTTONS */
button{
  background:#111;
  color:var(--gold);
  border:1px solid #92701a;
  border-radius:7px;
  min-height:34px;
  padding:5px;
  font-size:11px;
  font-weight:bold;
}

button.active{
  background:var(--gold);
  color:#000;
}

/* CAMERA AREA */
#stage{
  min-height:0;
  min-width:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}

/* FORCE NARROW PORTRAIT FRAME */
#frame{
  flex:none;
  position:relative;
  overflow:hidden;
  background:#000;
  border:1px solid #59420f;

  width:min(68vw,36dvh);
  aspect-ratio:210/297;
  max-width:100%;
  max-height:100%;
}

#camera,#overlay{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#overlay{
  touch-action:none;
}

/* BOTTOM MENU */
#bottom{
  max-height:31dvh;
  overflow-y:auto;
  padding:5px;
  border-top:1px solid #392b0c;
  background:#050505;
}

.panel{
  background:#101010;
  border:1px solid #30240d;
  border-radius:8px;
  padding:6px;
  margin-bottom:5px;
}

.heading{
  font-size:10px;
  letter-spacing:1px;
  margin-bottom:5px;
}

.row{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
}

.slider{
  margin:5px 0;
}

.sliderhead{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  margin-bottom:3px;
}

input[type=range]{
  width:100%;
  accent-color:var(--gold);
}

input[type=file]{
  display:none;
}

#status{
  text-align:center;
  font-size:10px;
  padding:3px;
  color:#907329;
}

@media(max-height:650px){
  #bottom{max-height:26dvh}
  button{min-height:28px}
}
</style>
</head>

<body>

<!-- TOP MENU -->
<div id="top">
  <div id="title">NEW TRACER GOLD</div>

  <div class="toolbar">
    <button id="cameraBtn">📷 Kamera</button>
    <button id="switchBtn">↔ Skift</button>
    <button id="fileBtn">▣ Reference</button>
    <button id="fitBtn">Fit</button>
    <button id="lockBtn">🔓 Lås</button>
  </div>

  <input id="file" type="file" accept="image/*">
</div>

<!-- CENTER CAMERA -->
<div id="stage">
  <div id="frame">
    <canvas id="camera"></canvas>
    <canvas id="overlay"></canvas>
  </div>
</div>

<!-- BOTTOM MENU -->
<div id="bottom">

  <div class="panel">
    <div class="heading">IMAGE TOOLS</div>
    <div class="row">
      <button id="bw">Sort/Hvid</button>
      <button id="gray">Grå</button>
      <button id="pencil">Blyant</button>
      <button id="contours">Kontur</button>
      <button id="edges">Kanter</button>
    </div>
  </div>

  <div class="panel">

    <div class="slider">
      <div class="sliderhead">
        <span>Reference zoom</span>
        <span id="zoomVal">100%</span>
      </div>
      <input id="zoom" type="range" min="10" max="500" value="100">
    </div>

    <div class="slider">
      <div class="sliderhead">
        <span>Transparens</span>
        <span id="opacityVal">50%</span>
      </div>
      <input id="opacity" type="range" min="0" max="100" value="50">
    </div>

    <div class="slider">
      <div class="sliderhead">
        <span>Kamera zoom</span>
        <span id="camZoomVal">1.0x</span>
      </div>
      <input id="camZoom" type="range" min="1" max="5" step="0.1" value="1">
    </div>

    <div class="slider">
      <div class="sliderhead">
        <span>Kontrast</span>
        <span id="contrastVal">100%</span>
      </div>
      <input id="contrast" type="range" min="50" max="250" value="100">
    </div>

  </div>

  <div class="panel">
    <div class="heading">POSITION</div>
    <div class="row">
      <button id="centerBtn">Center</button>
      <button id="resetBtn">Nulstil</button>
    </div>
  </div>

  <div id="status">Klar</div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const cam = $("camera");
const overlay = $("overlay");

const c = cam.getContext("2d",{willReadFrequently:true});
const o = overlay.getContext("2d");

const video = document.createElement("video");
video.playsInline = true;
video.muted = true;
video.autoplay = true;

let stream = null;
let facing = "environment";
let cameraOn = false;

let img = null;
let loaded = false;
let locked = false;

let x = 0;
let y = 0;
let scale = 1;
let fitScale = 1;
let opacity = 0.5;

let mode = "normal";
let cameraZoom = 1;
let contrast = 100;

let pointers = new Map();
let pinchDist = 0;
let pinchScale = 1;
let pinchX = 0;
let pinchY = 0;
let pinchMid = null;

function say(text){
  $("status").textContent = text;
}

/* RESIZE */
function resize(){
  const r = $("frame").getBoundingClientRect();
  const d = Math.min(window.devicePixelRatio || 1,2);

  cam.width = Math.max(1,Math.round(r.width*d));
  cam.height = Math.max(1,Math.round(r.height*d));

  overlay.width = cam.width;
  overlay.height = cam.height;

  c.setTransform(d,0,0,d,0,0);
  o.setTransform(d,0,0,d,0,0);

  if(loaded) fitImage();
  else drawReference();
}

window.addEventListener("resize",resize);

/* CAMERA */
async function startCamera(){
  try{
    if(stream){
      stream.getTracks().forEach(t=>t.stop());
    }

    say("Starter kamera...");

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:facing},
        width:{ideal:1920},
        height:{ideal:1080}
      },
      audio:false
    });

    video.srcObject = stream;
    await video.play();

    cameraOn = true;
    say("Kamera aktiv");
  }catch(e){
    say("Kamera kunne ikke startes");
  }
}

$("cameraBtn").onclick = startCamera;

$("switchBtn").onclick = ()=>{
  facing = facing === "environment" ? "user" : "environment";
  startCamera();
};

/* LOAD IMAGE */
$("fileBtn").onclick = ()=> $("file").click();

$("file").onchange = e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;

  const im = new Image();

  im.onload = ()=>{
    img = im;
    loaded = true;
    fitImage();
    say("Reference indlæst");
  };

  im.onerror = ()=> say("Billedet kunne ikke indlæses");

  im.src = URL.createObjectURL(f);
};

$("fitBtn").onclick = fitImage;

/* FIT IMAGE */
function fitImage(){
  if(!loaded || !img) return;

  const w = overlay.clientWidth;
  const h = overlay.clientHeight;

  fitScale = Math.min(w/img.width,h/img.height);
  scale = fitScale;

  x = (w-img.width*scale)/2;
  y = (h-img.height*scale)/2;

  $("zoom").value = 100;
  $("zoomVal").textContent = "100%";

  drawReference();
}

/* DRAW REFERENCE */
function drawReference(){
  const w = overlay.clientWidth;
  const h = overlay.clientHeight;

  o.clearRect(0,0,w,h);

  if(!loaded || !img) return;

  o.save();
  o.globalAlpha = opacity;
  o.drawImage(img,x,y,img.width*scale,img.height*scale);
  o.restore();
}

/* REFERENCE ZOOM */
$("zoom").oninput = e=>{
  if(!loaded) return;

  const ns = fitScale*Number(e.target.value)/100;
  const cx = overlay.clientWidth/2;
  const cy = overlay.clientHeight/2;

  const ratio = ns/scale;

  x = cx-(cx-x)*ratio;
  y = cy-(cy-y)*ratio;

  scale = ns;

  $("zoomVal").textContent = e.target.value+"%";
  drawReference();
};

/* OPACITY */
$("opacity").oninput = e=>{
  opacity = Number(e.target.value)/100;
  $("opacityVal").textContent = e.target.value+"%";
  drawReference();
};

/* CAMERA ZOOM */
$("camZoom").oninput = e=>{
  cameraZoom = Number(e.target.value);
  $("camZoomVal").textContent = cameraZoom.toFixed(1)+"x";
};

/* CONTRAST */
$("contrast").oninput = e=>{
  contrast = Number(e.target.value);
  $("contrastVal").textContent = contrast+"%";
};

/* LOCK */
$("lockBtn").onclick = ()=>{
  locked = !locked;

  $("lockBtn").textContent = locked ? "🔒 Låst" : "🔓 Lås";
  $("lockBtn").classList.toggle("active",locked);
};

/* CENTER */
$("centerBtn").onclick = ()=>{
  if(!loaded) return;

  x = (overlay.clientWidth-img.width*scale)/2;
  y = (overlay.clientHeight-img.height*scale)/2;

  drawReference();
};

/* RESET */
$("resetBtn").onclick = ()=>{
  mode = "normal";
  cameraZoom = 1;
  contrast = 100;
  locked = false;

  $("camZoom").value = 1;
  $("camZoomVal").textContent = "1.0x";

  $("contrast").value = 100;
  $("contrastVal").textContent = "100%";

  $("lockBtn").textContent = "🔓 Lås";
  $("lockBtn").classList.remove("active");

  ["bw","gray","pencil","contours","edges"].forEach(id=>{
    $(id).classList.remove("active");
  });

  if(loaded) fitImage();
  drawReference();
};

/* FILTER MODES */
function setMode(m){
  mode = mode === m ? "normal" : m;

  ["bw","gray","pencil","contours","edges"].forEach(id=>{
    $(id).classList.toggle("active",id===mode);
  });
}

$("bw").onclick = ()=>setMode("bw");
$("gray").onclick = ()=>setMode("gray");
$("pencil").onclick = ()=>setMode("pencil");
$("contours").onclick = ()=>setMode("contours");
$("edges").onclick = ()=>setMode("edges");

function getFilter(){
  if(mode==="bw") return "grayscale(1) contrast(220%)";
  if(mode==="gray") return "grayscale(1) contrast("+contrast+"%)";
  if(mode==="pencil") return "grayscale(1) contrast(250%) brightness(140%)";
  if(mode==="contours") return "grayscale(1) contrast(300%)";
  if(mode==="edges") return "grayscale(1) contrast(400%) invert(1)";
  return "contrast("+contrast+"%)";
}

/* CAMERA RENDER */
function drawCamera(){
  const w = cam.clientWidth;
  const h = cam.clientHeight;

  c.clearRect(0,0,w,h);

  if(cameraOn && video.readyState>=2 && video.videoWidth){
    const base = Math.max(w/video.videoWidth,h/video.videoHeight);
    const s = base*cameraZoom;

    const dw = video.videoWidth*s;
    const dh = video.videoHeight*s;

    const dx = (w-dw)/2;
    const dy = (h-dh)/2;

    c.save();
    c.filter = getFilter();
    c.drawImage(video,dx,dy,dw,dh);
    c.restore();

    if(mode==="bw") threshold();
  }

  requestAnimationFrame(drawCamera);
}

/* BLACK WHITE */
function threshold(){
  try{
    const data = c.getImageData(0,0,cam.width,cam.height);
    const p = data.data;

    for(let i=0;i<p.length;i+=4){
      const v = (p[i]+p[i+1]+p[i+2])/3 > 128 ? 255 : 0;
      p[i]=p[i+1]=p[i+2]=v;
    }

    c.putImageData(data,0,0);
  }catch(e){}
}

/* TOUCH / PAN / PINCH */
overlay.addEventListener("pointerdown",e=>{
  if(locked || !loaded) return;

  overlay.setPointerCapture(e.pointerId);

  pointers.set(e.pointerId,{
    x:e.clientX,
    y:e.clientY
  });

  if(pointers.size===2){
    const a = Array.from(pointers.values());

    pinchDist = Math.max(
      1,
      Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)
    );

    pinchScale = scale;
    pinchX = x;
    pinchY = y;

    pinchMid = {
      x:(a[0].x+a[1].x)/2,
      y:(a[0].y+a[1].y)/2
    };
  }
});

overlay.addEventListener("pointermove",e=>{
  if(locked || !pointers.has(e.pointerId)) return;

  const prev = pointers.get(e.pointerId);

  pointers.set(e.pointerId,{
    x:e.clientX,
    y:e.clientY
  });

  if(pointers.size===1){
    x += e.clientX-prev.x;
    y += e.clientY-prev.y;
    drawReference();
  }

  if(pointers.size===2 && pinchDist>0){
    const a = Array.from(pointers.values());

    const dist = Math.hypot(
      a[0].x-a[1].x,
      a[0].y-a[1].y
    );

    const mid = {
      x:(a[0].x+a[1].x)/2,
      y:(a[0].y+a[1].y)/2
    };

    scale = Math.max(
      fitScale*0.1,
      Math.min(fitScale*5,pinchScale*dist/pinchDist)
    );

    x = pinchX+mid.x-pinchMid.x;
    y = pinchY+mid.y-pinchMid.y;

    const z = Math.round(scale/fitScale*100);

    $("zoom").value = z;
    $("zoomVal").textContent = z+"%";

    drawReference();
  }
});

function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinchDist=0;
}

overlay.addEventListener("pointerup",endPointer);
overlay.addEventListener("pointercancel",endPointer);

/* INITIALIZE */
resize();
requestAnimationFrame(drawCamera);

</script>
</body>
</html>
