
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111111">
<title>New Tracer Gold</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

header {
  background: #1b1b1b;
  padding: 12px;
  text-align: center;
  color: #d6b45b;
  font-size: 20px;
  font-weight: bold;
}

#stage {
  position: relative;
  width: 100vw;
  height: calc(100dvh - 170px);
  background: #000;
  overflow: hidden;
  touch-action: none;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#cameraCanvas {
  z-index: 1;
}

#overlayCanvas {
  z-index: 2;
  touch-action: none;
}

#controls {
  height: 170px;
  overflow-y: auto;
  background: #1a1a1a;
  padding: 8px;
}

.row {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-bottom: 7px;
}

button, .fileButton {
  border: 1px solid #b99a48;
  background: #292929;
  color: #f1d27a;
  border-radius: 8px;
  padding: 10px 8px;
  font-size: 13px;
  font-weight: bold;
}

button:active {
  background: #55451e;
}

input[type="range"] {
  width: 100%;
  accent-color: #d6b45b;
}

label {
  font-size: 12px;
  color: #ddd;
  min-width: 65px;
}

.small {
  font-size: 11px;
  color: #aaa;
}

#status {
  color: #d6b45b;
  font-size: 12px;
  padding: 3px;
}

input[type="file"] {
  display: none;
}
</style>
</head>

<body>

<header>NEW TRACER GOLD</header>

<div id="stage">
  <canvas id="cameraCanvas"></canvas>
  <canvas id="overlayCanvas"></canvas>
</div>

<div id="controls">

  <div class="row">
    <button id="cameraBtn">Start kamera</button>
    <button id="flipBtn">Skift kamera</button>
    <button id="resetBtn">Nulstil</button>
    <button id="fitBtn">Tilpas</button>
  </div>

  <div class="row">
    <label>Kamera zoom</label>
    <input id="cameraZoom" type="range" min="1" max="5" step="0.1" value="1">
  </div>

  <div class="row">
    <label>Reference</label>
    <label class="fileButton" for="imageFile">Vælg billede</label>
    <input id="imageFile" type="file" accept="image/*">
    <button id="lockBtn">Lås reference</button>
  </div>

  <div class="row">
    <label>Gennemsigtighed</label>
    <input id="opacity" type="range" min="0" max="100" value="50">
  </div>

  <div class="row">
    <label>Reference zoom</label>
    <input id="imageZoom" type="range" min="0.2" max="4" step="0.05" value="1">
  </div>

  <div class="row">
    <button id="contourBtn">Konturer OFF</button>
    <button id="grayBtn">Gråtone OFF</button>
  </div>

  <div id="status">Klar. Start kamera og vælg et referencebillede.</div>

  <div class="small">
    Flyt og zoom referencebilledet med fingrene.
    Tegn på papiret, ikke på telefonen.
  </div>

</div>

<script>
(() => {
"use strict";

const stage = document.getElementById("stage");
const cameraCanvas = document.getElementById("cameraCanvas");
const overlayCanvas = document.getElementById("overlayCanvas");

const cameraCtx = cameraCanvas.getContext("2d");
const overlayCtx = overlayCanvas.getContext("2d");

const cameraBtn = document.getElementById("cameraBtn");
const flipBtn = document.getElementById("flipBtn");
const resetBtn = document.getElementById("resetBtn");
const fitBtn = document.getElementById("fitBtn");
const lockBtn = document.getElementById("lockBtn");

const cameraZoom = document.getElementById("cameraZoom");
const imageZoom = document.getElementById("imageZoom");
const opacity = document.getElementById("opacity");
const imageFile = document.getElementById("imageFile");

const contourBtn = document.getElementById("contourBtn");
const grayBtn = document.getElementById("grayBtn");
const status = document.getElementById("status");

let video = document.createElement("video");
video.autoplay = true;
video.playsInline = true;
video.muted = true;

let stream = null;
let facingMode = "environment";

let referenceImage = null;
let referenceLoaded = false;

let overlayX = 0;
let overlayY = 0;
let overlayScale = 1;

let locked = false;
let contours = false;
let grayscale = false;

let pointerMap = new Map();
let lastPointer = null;
let pinchDistance = 0;
let pinchScale = 1;
let pinchCenter = null;

let stageWidth = 0;
let stageHeight = 0;

function setStatus(message) {
  status.textContent = message;
}

function resize() {
  const rect = stage.getBoundingClientRect();

  stageWidth = rect.width;
  stageHeight = rect.height;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  cameraCanvas.width = Math.round(stageWidth * dpr);
  cameraCanvas.height = Math.round(stageHeight * dpr);

  overlayCanvas.width = Math.round(stageWidth * dpr);
  overlayCanvas.height = Math.round(stageHeight * dpr);

  cameraCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawOverlay();
}

window.addEventListener("resize", resize);
resize();

function drawCamera() {
  if (!video || !video.videoWidth || !video.videoHeight) {
    requestAnimationFrame(drawCamera);
    return;
  }

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  const zoom = Number(cameraZoom.value);

  const aspect = stageWidth / stageHeight;

  let cropW = vw;
  let cropH = vh;

  if (vw / vh > aspect) {
    cropW = vh * aspect;
  } else {
    cropH = vw / aspect;
  }

  cropW /= zoom;
  cropH /= zoom;

  const sx = (vw - cropW) / 2;
  const sy = (vh - cropH) / 2;

  cameraCtx.clearRect(0, 0, stageWidth, stageHeight);

  cameraCtx.save();

  if (grayscale) {
    cameraCtx.filter = "grayscale(100%)";
  } else {
    cameraCtx.filter = "none";
  }

  cameraCtx.drawImage(
    video,
    sx, sy, cropW, cropH,
    0, 0, stageWidth, stageHeight
  );

  cameraCtx.restore();

  if (contours) {
    drawContours();
  }

  requestAnimationFrame(drawCamera);
}

function drawContours() {
  try {
    const imageData = cameraCtx.getImageData(
      0, 0, stageWidth, stageHeight
    );

    const data = imageData.data;
    const w = stageWidth;
    const h = stageHeight;

    const step = 2;

    for (let y = step; y < h - step; y += step) {
      for (let x = step; x < w - step; x += step) {
        const i = (y * w + x) * 4;

        const left = ((y * w + (x - step)) * 4);
        const right = ((y * w + (x + step)) * 4);
        const up = (((y - step) * w + x) * 4);
        const down = (((y + step) * w + x) * 4);

        const lumL = data[left];
        const lumR = data[right];
        const lumU = data[up];
        const lumD = data[down];

        const edge =
          Math.abs(lumL - lumR) +
          Math.abs(lumU - lumD);

        if (edge > 100) {
          data[i] = 255;
          data[i + 1] = 215;
          data[i + 2] = 80;
          data[i + 3] = 255;
        }
      }
    }

    cameraCtx.putImageData(imageData, 0, 0);

  } catch (e) {
    // Konturer kan være utilgængelige på visse enheder.
  }
}

function drawOverlay() {
  overlayCtx.clearRect(0, 0, stageWidth, stageHeight);

  if (!referenceLoaded || !referenceImage) return;

  const opacityValue = Number(opacity.value) / 100;

  const imgW = referenceImage.width * overlayScale;
  const imgH = referenceImage.height * overlayScale;

  overlayCtx.save();
  overlayCtx.globalAlpha = opacityValue;

  overlayCtx.drawImage(
    referenceImage,
    overlayX,
    overlayY,
    imgW,
    imgH
  );

  overlayCtx.restore();
}

function fitReference() {
  if (!referenceLoaded) return;

  const scaleX = stageWidth * 0.85 / referenceImage.width;
  const scaleY = stageHeight * 0.85 / referenceImage.height;

  overlayScale = Math.min(scaleX, scaleY);

  imageZoom.value = 1;

  overlayX = (stageWidth - referenceImage.width * overlayScale) / 2;
  overlayY = (stageHeight - referenceImage.height * overlayScale) / 2;

  drawOverlay();
}

function resetReference() {
  if (!referenceLoaded) return;

  overlayScale = 1;
  imageZoom.value = 1;

  overlayX = (stageWidth - referenceImage.width) / 2;
  overlayY = (stageHeight - referenceImage.height) / 2;

  locked = false;
  lockBtn.textContent = "Lås reference";

  drawOverlay();
}

imageFile.addEventListener("change", event => {
  const file = event.target.files && event.target.files[0];

  if (!file) return;

  const url = URL.createObjectURL(file);

  const img = new Image();

  img.onload = () => {
    referenceImage = img;
    referenceLoaded = true;

    overlayScale = 1;
    imageZoom.value = 1;

    fitReference();

    setStatus("Referencebillede indlæst.");
    URL.revokeObjectURL(url);
  };

  img.onerror = () => {
    setStatus("Billedet kunne ikke indlæses.");
    URL.revokeObjectURL(url);
  };

  img.src = url;
});

opacity.addEventListener("input", drawOverlay);

imageZoom.addEventListener("input", () => {
  if (!referenceLoaded || locked) return;

  const newScale = Number(imageZoom.value);

  const centerX = overlayX + referenceImage.width * overlayScale / 2;
  const centerY = overlayY + referenceImage.height * overlayScale / 2;

  overlayScale = newScale;

  overlayX = centerX - referenceImage.width * overlayScale / 2;
  overlayY = centerY - referenceImage.height * overlayScale / 2;

  drawOverlay();
});

lockBtn.addEventListener("click", () => {
  locked = !locked;

  lockBtn.textContent = locked ? "Låst" : "Lås reference";

  setStatus(locked ? "Reference låst." : "Reference låst op.");
});

resetBtn.addEventListener("click", resetReference);
fitBtn.addEventListener("click", fitReference);

contourBtn.addEventListener("click", () => {
  contours = !contours;
  contourBtn.textContent = contours ? "Konturer ON" : "Konturer OFF";
});

grayBtn.addEventListener("click", () => {
  grayscale = !grayscale;
  grayBtn.textContent = grayscale ? "Gråtone ON" : "Gråtone OFF";
});

cameraZoom.addEventListener("input", () => {});

async function startCamera() {
  try {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: facingMode,
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    cameraBtn.textContent = "Kamera aktiv";
    setStatus("Kamera startet.");

  } catch (error) {
    setStatus("Kamera fejl: " + error.message);
  }
}

cameraBtn.addEventListener("click", startCamera);

flipBtn.addEventListener("click", async () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  await startCamera();
});

// Flyt og zoom kun referencebilledet.
// Der er ingen tegnefunktion på telefonens skærm.

function distance(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

function centerOfTwo(a, b) {
  return {
    x: (a.x + b.x) / 2,
    y: (a.y + b.y) / 2
  };
}

overlayCanvas.addEventListener("pointerdown", event => {
  overlayCanvas.setPointerCapture(event.pointerId);

  pointerMap.set(event.pointerId, {
    x: event.offsetX,
    y: event.offsetY
  });

  if (pointerMap.size === 1) {
    lastPointer = {
      x: event.offsetX,
      y: event.offsetY
    };
  }

  if (pointerMap.size === 2) {
    const points = Array.from(pointerMap.values());

    pinchDistance = distance(points[0], points[1]);
    pinchScale = overlayScale;
    pinchCenter = centerOfTwo(points[0], points[1]);
  }
});

overlayCanvas.addEventListener("pointermove", event => {
  if (!pointerMap.has(event.pointerId)) return;

  pointerMap.set(event.pointerId, {
    x: event.offsetX,
    y: event.offsetY
  });

  if (locked || !referenceLoaded) return;

  if (pointerMap.size === 1 && lastPointer) {
    const current = pointerMap.get(event.pointerId);

    overlayX += current.x - lastPointer.x;
    overlayY += current.y - lastPointer.y;

    lastPointer = {
      x: current.x,
      y: current.y
    };

    drawOverlay();
  }

  if (pointerMap.size === 2) {
    const points = Array.from(pointerMap.values());

    const newDistance = distance(points[0], points[1]);
    const newCenter = centerOfTwo(points[0], points[1]);

    if (pinchDistance > 0) {
      const factor = newDistance / pinchDistance;

      const newScale = Math.max(
        0.1,
        Math.min(8, pinchScale * factor)
      );

      const oldCenterX =
        overlayX + referenceImage.width * overlayScale / 2;

      const oldCenterY =
        overlayY + referenceImage.height * overlayScale / 2;

      overlayScale = newScale;

      overlayX = oldCenterX - referenceImage.width * overlayScale / 2;
      overlayY = oldCenterY - referenceImage.height * overlayScale / 2;

      overlayX += newCenter.x - pinchCenter.x;
      overlayY += newCenter.y - pinchCenter.y;

      imageZoom.value = Math.min(
        4,
        Math.max(0.2, overlayScale)
      );

      pinchCenter = newCenter;
      pinchScale = overlayScale;
      pinchDistance = newDistance;
    }

    drawOverlay();
  }
});

function endPointer(event) {
  pointerMap.delete(event.pointerId);

  if (pointerMap.size === 1) {
    const remaining = Array.from(pointerMap.values())[0];

    lastPointer = {
      x: remaining.x,
      y: remaining.y
    };
  } else {
    lastPointer = null;
    pinchDistance = 0;
  }
}

overlayCanvas.addEventListener("pointerup", endPointer);
overlayCanvas.addEventListener("pointercancel", endPointer);
overlayCanvas.addEventListener("pointerleave", event => {
  if (pointerMap.has(event.pointerId)) endPointer(event);
});

requestAnimationFrame(drawCamera);

})();
</script>

</body>
</html>
