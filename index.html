<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080808">
<link rel="manifest" href="./manifest.webmanifest">
<title>Tracer Studio Gold</title>

<style>
:root {
  --gold:#d6ad52;
  --gold2:#f3d78b;
  --black:#080808;
  --panel:#151515;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0;background:var(--black);color:white;font-family:Arial,sans-serif; }
header {
  padding:16px;background:#050505;border-bottom:1px solid #705522;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.logo { font-size:21px;font-weight:bold;color:var(--gold); }
.logo span { color:white; }
header small { color:var(--gold2);font-size:11px; }
.container { max-width:800px;margin:auto;padding:12px; }
.panel { background:var(--panel);border:1px solid #34302a;border-radius:13px;padding:14px;margin-bottom:13px; }
h3 { color:var(--gold);font-size:16px;margin:0 0 13px; }

/* BUTTONS */
button,select {
  background:#222;color:white;border:1px solid #80652d;
  border-radius:9px;padding:12px;font-size:14px;
}
button:active { background:#55421d; }
button:disabled { opacity:.6; }
.gold-button { background:linear-gradient(135deg,#d2a64c,#806024);color:#000;font-weight:bold; }
.upload-btn {
  display:block;text-align:center;width:100%;margin:10px 0;
  border-radius:9px;padding:13px;
}
input[type=file] { display:none; }

/* CAMERA BUTTON FIX */
.camera-button {
  display:block !important;
  visibility:visible !important;
  opacity:1 !important;
  position:relative;
  width:100% !important;
  min-height:60px;
  margin:10px 0 14px;
  padding:16px;
  background:linear-gradient(135deg,#ffe18a,#d2a64c,#916b24) !important;
  color:#000 !important;
  border:2px solid #f3d78b !important;
  border-radius:12px;
  font-size:18px !important;
  font-weight:bold;
  text-align:center;
  box-shadow:0 0 14px rgba(214,173,82,.25);
  z-index:5;
}
.camera-button:disabled {
  opacity:1 !important;
  color:#000 !important;
}

.canvas-wrap {
  width:100%;height:58vh;min-height:320px;max-height:700px;
  background:#111;border:2px solid #b58a38;border-radius:12px;
  overflow:hidden;position:relative;touch-action:none;
}
canvas { display:block;width:100%;height:100%;touch-action:none; }
.canvas-message {
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:25px;color:#ccc;pointer-events:none;
}
.control { margin-bottom:15px; }
.control label {
  display:flex;justify-content:space-between;
  font-size:13px;margin-bottom:8px;
}
.value { color:var(--gold2); }
input[type=range] { width:100%;accent-color:var(--gold);height:25px; }
select { width:100%; }
.button-grid { display:grid;grid-template-columns:1fr 1fr;gap:8px; }
.button-grid button { min-height:45px; }
.status { text-align:center;color:var(--gold2);font-size:12px;padding:9px; }
.tip { color:#bbb;font-size:13px;line-height:1.6; }
footer { text-align:center;color:#777;font-size:11px;padding:18px; }
.install { width:100%;margin-top:8px;background:#111;color:var(--gold2); }

.download-btn {
  background:linear-gradient(135deg,#3eaa68,#1e7a45) !important;
  color:#fff !important;
  border:1px solid #5fd48a !important;
  font-weight:bold;
  width:100%;
  margin-top:10px;
  min-height:48px;
}

@media(max-width:400px) {
  .canvas-wrap { height:53vh; }
}
</style>
</head>

    <small>GOLD EDITION</small>
  </div>
