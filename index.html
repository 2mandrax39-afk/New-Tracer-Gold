
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111111">
<title>New Tracer Gold</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #101010;
  color: #f0d58a;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 14px;
  font-size: 24px;
  font-weight: bold;
  color: #d4af37;
  letter-spacing: 2px;
}

#stage {
  position: relative;
  width: 100%;
  height: 60vh;
  min-height: 300px;
  background: #000;
  overflow: hidden;
  touch-action: none;
}

#cameraCanvas,
#overlayCanvas,
#drawCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#cameraCanvas {
  z-index: 1;
}

#overlayCanvas {
  z-index: 2;
  touch-action: none;
}

#drawCanvas {
  z-index: 3;
  touch-action: none;
  pointer-events: none;
}

#message {
  text-align: center;
  color: #aaa;
  padding: 8px;
  font-size: 13px;
}

.controls {
  padding: 10px;
}

button {
  background: #222;
  color: #e6c65c;
  border: 1px solid #b9962e;
  border-radius: 9px;
  padding: 12px 8px;
  font-size: 14px;
  font-weight: bold;
}

button:active {
  background: #4b3a13;
}

button.active {
  background: #d4af37;
  color: #111;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 10px;
}

.grid.two {
  grid-template-columns: repeat(2, 1fr);
}

.sliderbox {
  background: #1b1b1b;
  border: 1px solid #3a3018;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 9px;
}

.sliderbox label {
  display: block;
  font-size: 13px;
  margin-bottom: 8px;
  color: #e6c65c;
}

input[type=range] {
  width: 100%;
  accent-color: #d4af37;
}

#fileInput {
  display: none;
}

.small {
  font-size: 12px;
  color: #aaa;
  text-align: center;
  padding: 4px;
}

footer {
  color: #666;
  text-align: center;
  padding: 12px;
  font-size: 11px;
}
</style>
</head>

<body>

<header>NEW TRACER GOLD</header>

<div id="stage">
  <canvas id="cameraCanvas"></canvas>
  <canvas id="overlayCanvas"></canvas>
  <canvas id="drawCanvas"></canvas>
</div>

<div id="message">Start kameraet og vælg et billede</div>

<div class="controls">

  <div class="grid two">
    <button id="cameraBtn">📷 Start kamera</button>
    <button id="photoBtn">🖼️ Vælg billede</button>
  </div>

  <input type="file" id="fileInput" accept="image/*">

  <div class="sliderbox">
    <label>Kamera-zoom: <span id="cameraZoomText">200%</span></label>
    <input id="cameraZoom" type="range" min="100" max="400" value="200">
  </div>

  <div class="sliderbox">
    <label>Billed-transparens: <span id="opacityText">50%</span></label>
    <input id="opacity" type="range" min="0" max="100" value="50">
  </div>

  <div class="sliderbox">
    <label>Billed-zoom: <span id="imageZoomText">100%</span></label>
    <input id="imageZoom" type="range" min="25" max="300" value="100">
  </div>

  <div class="grid">
    <button id="pencilBtn">✏️ Blyant</button>
    <button id="contourBtn">◐ Konturer</button>
    <button id="grayBtn">◑ Gråtoner</button>
  </div>

  <div class="grid two">
    <button id="lockBtn">🔓 Lås billede</button>
    <button id="clearDrawBtn">🗑️ Slet tegning</button>
  </div>

  <div class="grid two">
    <button id="resetBtn">↺ Nulstil</button>
    <button id="fitBtn">⛶ Tilpas billede</button>
  </div>

  <div class="sliderbox">
    <label>Blyant størrelse</label>
    <input id="brushSize" type="range" min="1" max="20" value="3">
  </div>

</div>

<div class="small">
  Brug to fingre til at zoome og flytte billedet.
</div>

<footer>New Tracer Gold</footer>

<script>
/* =========================
   NEW TRACER GOLD
   SERVICE WORKER REMOVED
========================= */

const stage = document.getElementById("stage");
const cameraCanvas = document.getElementById("cameraCanvas");
const overlayCanvas = document.getElementById("overlayCanvas");
const drawCanvas = document.getElementById("drawCanvas");

const cameraCtx = cameraCanvas.getContext("2d");
const overlayCtx = overlayCanvas.getContext("2d");
const drawCtx = drawCanvas.getContext("2d");

const cameraBtn = document.getElementById("cameraBtn");
const photoBtn = document.getElementById("photoBtn");
const fileInput = document.getElementById("fileInput");

const cameraZoom = document.getElementById("cameraZoom");
const opacitySlider = document.getElementById("opacity");
const imageZoomSlider = document.getElementById("imageZoom");
const brushSizeSlider = document.getElementById("brushSize");

const cameraZoomText = document.getElementById("cameraZoomText");
const opacityText = document.getElementById("opacityText");
const imageZoomText = document.getElementById("imageZoomText");
const message = document.getElementById("message");

const pencilBtn = document.getElementById("pencilBtn");
const contourBtn = document.getElementById("contourBtn");
const grayBtn = document.getElementById("grayBtn");
const lockBtn = document.getElementById("lockBtn");

let video = document.createElement("video");
video.autoplay = true;
video.playsInline = true;
video.muted = true;

let stream = null;
let cameraOn = false;

let overlayImage = null;
let overlayLoaded = false;

let overlayOpacity = 0.5;
let overlayScale = 1;
let overlayX = 0;
let overlayY = 0;

let cameraZoomValue = 2;

let imageLocked = false;
let drawMode = false;
let contourMode = false;
let grayscaleMode = false;

let drawing = false;
let lastX = 0;
let lastY = 0;

let animationFrame = null;

let pointers = new Map();
let pinchStartDistance = 0;
let pinchStartScale = 1;
let pinchStartX = 0;
let pinchStartY = 0;
let pinchStartMidX = 0;
let pinchStartMidY = 0;

/* CANVAS SIZE */

function resizeCanvas() {
  const rect = stage.getBoundingClientRect();

  [cameraCanvas, overlayCanvas, drawCanvas].forEach(canvas => {
    canvas.width = Math.round(rect.width * devicePixelRatio);
    canvas.height = Math.round(rect.height * devicePixelRatio);
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
  });

  cameraCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  overlayCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  drawCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

  renderOverlay();
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* CAMERA */

async function startCamera() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      message.textContent = "Din browser understøtter ikke kamera.";
      return;
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "environment"
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    cameraOn = true;
    cameraBtn.textContent = "⏹ Stop kamera";
    message.textContent = "Kamera aktiv. Brug kamera-zoom til at gøre papiret større.";

    renderCamera();

  } catch (error) {
    console.error(error);
    message.textContent = "Kamera kunne ikke startes. Kontrollér kamera-tilladelsen.";
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
  cameraOn = false;

  if (animationFrame) {
    cancelAnimationFrame(animationFrame);
    animationFrame = null;
  }

  cameraCtx.clearRect(
    0, 0,
    cameraCanvas.width / devicePixelRatio,
    cameraCanvas.height / devicePixelRatio
  );

  cameraBtn.textContent = "📷 Start kamera";
  message.textContent = "Kamera stoppet.";
}

function renderCamera() {
  if (!cameraOn) return;

  const width = cameraCanvas.width / devicePixelRatio;
  const height = cameraCanvas.height / devicePixelRatio;

  if (video.readyState >= 2) {
    const vw = video.videoWidth;
    const vh = video.videoHeight;

    if (vw && vh) {
      const zoom = cameraZoomValue;

      const cropWidth = vw / zoom;
      const cropHeight = vh / zoom;

      const sx = (vw - cropWidth) / 2;
      const sy = (vh - cropHeight) / 2;

      cameraCtx.clearRect(0, 0, width, height);

      cameraCtx.save();

      if (grayscaleMode) {
        cameraCtx.filter = "grayscale(100%)";
      } else if (contourMode) {
        cameraCtx.filter = "contrast(180%) grayscale(100%)";
      } else {
        cameraCtx.filter = "none";
      }

      cameraCtx.drawImage(
        video,
        sx, sy, cropWidth, cropHeight,
        0, 0, width, height
      );

      cameraCtx.restore();
    }
  }

  animationFrame = requestAnimationFrame(renderCamera);
}

/* IMAGE */

photoBtn.addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", event => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = () => {
    overlayImage = img;
    overlayLoaded = true;

    overlayScale = 1;
    overlayX = 0;
    overlayY = 0;

    imageZoomSlider.value = 100;
    imageZoomText.textContent = "100%";

    renderOverlay();
    message.textContent = "Billede indlæst. Du kan flytte og zoome billedet.";
    URL.revokeObjectURL(url);
  };

  img.onerror = () => {
    message.textContent = "Billedet kunne ikke åbnes.";
    URL.revokeObjectURL(url);
  };

  img.src = url;
});

/* OVERLAY DRAWING */

function renderOverlay() {
  const width = overlayCanvas.width / devicePixelRatio;
  const height = overlayCanvas.height / devicePixelRatio;

  overlayCtx.clearRect(0, 0, width, height);

  if (!overlayLoaded || !overlayImage) return;

  const baseScale = Math.min(
    width / overlayImage.width,
    height / overlayImage.height
  );

  const scale = baseScale * overlayScale;

  const drawWidth = overlayImage.width * scale;
  const drawHeight = overlayImage.height * scale;

  const centerX = width / 2 + overlayX;
  const centerY = height / 2 + overlayY;

  overlayCtx.save();
  overlayCtx.globalAlpha = overlayOpacity;

  if (grayscaleMode) {
    overlayCtx.filter = "grayscale(100%)";
  } else if (contourMode) {
    overlayCtx.filter = "grayscale(100%) contrast(180%)";
  } else {
    overlayCtx.filter = "none";
  }

  overlayCtx.drawImage(
    overlayImage,
    centerX - drawWidth / 2,
    centerY - drawHeight / 2,
    drawWidth,
    drawHeight
  );

  overlayCtx.restore();
}

cameraZoom.addEventListener("input", () => {
  cameraZoomValue = Number(cameraZoom.value) / 100;
  cameraZoomText.textContent = cameraZoom.value + "%";
});

opacitySlider.addEventListener("input", () => {
  overlayOpacity = Number(opacitySlider.value) / 100;
  opacityText.textContent = opacitySlider.value + "%";
  renderOverlay();
});

imageZoomSlider.addEventListener("input", () => {
  overlayScale = Number(imageZoomSlider.value) / 100;
  imageZoomText.textContent = imageZoomSlider.value + "%";
  renderOverlay();
});

/* BUTTONS */

cameraBtn.addEventListener("click", () => {
  if (cameraOn) {
    stopCamera();
  } else {
    startCamera();
  }
});

pencilBtn.addEventListener("click", () => {
  drawMode = !drawMode;

  if (drawMode) {
    pencilBtn.classList.add("active");
    overlayCanvas.style.pointerEvents = "none";
    drawCanvas.style.pointerEvents = "auto";
    message.textContent = "Blyant aktiv. Tegn med fingeren.";
  } else {
    pencilBtn.classList.remove("active");
    drawCanvas.style.pointerEvents = "none";
    overlayCanvas.style.pointerEvents = "auto";
    message.textContent = "Blyant slået fra.";
  }
});

contourBtn.addEventListener("click", () => {
  contourMode = !contourMode;

  contourBtn.classList.toggle("active", contourMode);

  if (contourMode) {
    grayscaleMode = false;
    grayBtn.classList.remove("active");
  }

  renderOverlay();
});

grayBtn.addEventListener("click", () => {
  grayscaleMode = !grayscaleMode;

  grayBtn.classList.toggle("active", grayscaleMode);

  if (grayscaleMode) {
    contourMode = false;
    contourBtn.classList.remove("active");
  }

  renderOverlay();
});

lockBtn.addEventListener("click", () => {
  imageLocked = !imageLocked;

  lockBtn.textContent = imageLocked
    ? "🔒 Billede låst"
    : "🔓 Lås billede";

  lockBtn.classList.toggle("active", imageLocked);
});

document.getElementById("clearDrawBtn").addEventListener("click", () => {
  drawCtx.clearRect(
    0, 0,
    drawCanvas.width,
    drawCanvas.height
  );

  message.textContent = "Tegning slettet.";
});

document.getElementById("resetBtn").addEventListener("click", () => {
  overlayScale = 1;
  overlayX = 0;
  overlayY = 0;
  overlayOpacity = 0.5;
  cameraZoomValue = 2;

  imageZoomSlider.value = 100;
  imageZoomText.textContent = "100%";

  opacitySlider.value = 50;
  opacityText.textContent = "50%";

  cameraZoom.value = 200;
  cameraZoomText.textContent = "200%";

  drawCtx.clearRect(
    0, 0,
    drawCanvas.width,
    drawCanvas.height
  );

  renderOverlay();

  message.textContent = "Indstillinger nulstillet.";
});

document.getElementById("fitBtn").addEventListener("click", () => {
  overlayScale = 1;
  overlayX = 0;
  overlayY = 0;

  imageZoomSlider.value = 100;
  imageZoomText.textContent = "100%";

  renderOverlay();
  message.textContent = "Billede tilpasset skærmen.";
});

/* POINTER / TOUCH */

function getPoint(event) {
  const rect = stage.getBoundingClientRect();

  return {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  };
}

function distance(a, b) {
  return Math.hypot(b.x - a.x, b.y - a.y);
}

function midpoint(a, b) {
  return {
    x: (a.x + b.x) / 2,
    y: (a.y + b.y) / 2
  };
}

stage.addEventListener("pointerdown", event => {
  event.preventDefault();

  stage.setPointerCapture(event.pointerId);

  const point = getPoint(event);
  pointers.set(event.pointerId, point);

  if (drawMode) {
    if (pointers.size === 1) {
      drawing = true;
      lastX = point.x;
      lastY = point.y;
    }
    return;
  }

  if (!imageLocked && pointers.size === 1) {
    lastX = point.x;
    lastY = point.y;
  }

  if (pointers.size === 2) {
    const pts = Array.from(pointers.values());

    pinchStartDistance = distance(pts[0], pts[1]);
    pinchStartScale = overlayScale;

    pinchStartX = overlayX;
    pinchStartY = overlayY;

    const mid = midpoint(pts[0], pts[1]);
    pinchStartMidX = mid.x;
    pinchStartMidY = mid.y;
  }
});

stage.addEventListener("pointermove", event => {
  if (!pointers.has(event.pointerId)) return;

  event.preventDefault();

  const point = getPoint(event);
  pointers.set(event.pointerId, point);

  if (drawMode && drawing && pointers.size === 1) {
    drawCtx.lineWidth = Number(brushSizeSlider.value);
    drawCtx.lineCap = "round";
    drawCtx.lineJoin = "round";
    drawCtx.strokeStyle = "#d4af37";

    drawCtx.beginPath();
    drawCtx.moveTo(lastX, lastY);
    drawCtx.lineTo(point.x, point.y);
    drawCtx.stroke();

    lastX = point.x;
    lastY = point.y;
    return;
  }

  if (pointers.size === 2 && !imageLocked && !drawMode) {
    const pts = Array.from(pointers.values());

    const newDistance = distance(pts[0], pts[1]);
    const mid = midpoint(pts[0], pts[1]);

    if (pinchStartDistance > 0) {
      const ratio = newDistance / pinchStartDistance;

      overlayScale = Math.max(
        0.25,
        Math.min(5, pinchStartScale * ratio)
      );

      overlayX = pinchStartX + (mid.x - pinchStartMidX);
      overlayY = pinchStartY + (mid.y - pinchStartMidY);

      const percent = Math.round(overlayScale * 100);
      imageZoomSlider.value = Math.max(
        25,
        Math.min(300, percent)
      );

      imageZoomText.textContent = percent + "%";
      renderOverlay();
    }
  } else if (pointers.size === 1 && !imageLocked && !drawMode) {
    const dx = point.x - lastX;
    const dy = point.y - lastY;

    overlayX += dx;
    overlayY += dy;

    lastX = point.x;
    lastY = point.y;

    renderOverlay();
  }
});

function pointerEnd(event) {
  pointers.delete(event.pointerId);

  if (pointers.size === 0) {
    drawing = false;
    pinchStartDistance = 0;
  }

  if (pointers.size === 1) {
    const remaining = Array.from(pointers.values())[0];
    lastX = remaining.x;
    lastY = remaining.y;
  }
}

stage.addEventListener("pointerup", pointerEnd);
stage.addEventListener("pointercancel", pointerEnd);
stage.addEventListener("pointerleave", event => {
  if (event.buttons === 0) pointerEnd(event);
});

/* INITIAL STATE */

drawCanvas.style.pointerEvents = "none";
overlayCanvas.style.pointerEvents = "auto";

message.textContent = "Start kameraet og vælg et billede.";

</script>

</body>
</html>
